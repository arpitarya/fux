# One setup for every CI job — Python, optionally Node, and fux installed.
#
# Checkout stays in the calling job: a composite action cannot check out the
# repository it lives in. `shell: bash` on every step, because the matrix runs
# on Windows too and pwsh would read the install line differently.
name: setup-fux
description: Python (pip-cached), optional Node, and the four distributions plus the fifteen plugin packages installed editable (`.[extras]` on fux-engine)
inputs:
  python:
    description: Python version (L7 floor is 3.12)
    required: true
  node:
    description: Node version, or empty for none (L8 floor is 22)
    required: false
    default: ""
  extras:
    description: pip extras to install with the package; empty for the bare engine
    required: false
    default: dev
runs:
  using: composite
  steps:
    # W-243 step 3: on Windows the default temp dir is on C:, the OS drive;
    # the workspace and `$RUNNER_TEMP` are on D:. pip's own CI measured 10-28 %
    # from moving temp alone. First, so pip's build dirs land there too.
    - if: runner.os == 'Windows'
      shell: bash
      run: |
        echo "TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
        echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"

    - uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python }}
        cache: pip

    - if: inputs.node != ''
      uses: actions/setup-node@v5
      with:
        node-version: ${{ inputs.node }}

    - name: Install fux
      shell: bash
      run: |
        # W-282: fux-engine depends on the three role packages at this
        # release's version, which PyPI does not have until it is released —
        # so all four go on ONE pip command line and resolve from this tree.
        roles="-e packages/fux-core -e packages/fux-reader -e packages/fux-writer"
        # W-289: the fifteen plugin packages (SR-PLUGINS), from this tree, on
        # EVERY job — with extras or without. Since phase 2 this repository's
        # committed .fux/plugins.toml declares the decoders it reads, and a
        # declared package that is not installed stops every verb that reads
        # the index (P4): the bare-engine jobs run `fux build` and the arm on
        # this repo, so they need them as much as the dev jobs do. Editable,
        # so the installed files are this tree's and match the pinned digests.
        plugins=""
        for d in packages/fux-decoder-* packages/fux-fetcher-* packages/fux-extension-*; do
          plugins="$plugins -e $d"
        done
        if [ -n "${{ inputs.extras }}" ]; then
          pip install $roles $plugins -e ".[${{ inputs.extras }}]"
        else
          pip install $roles $plugins -e .
        fi
