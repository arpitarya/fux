name: Publish

on:
  release:
    types: [published]

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read   # to read CI's verdict on the commit being released

    steps:
      - uses: actions/checkout@v5

      - name: CI must be green on the exact commit being released
        # Two strikes, so a gate (SR-WORK-SESSION d13). 3.0.0-alpha.2 and
        # 3.0.0-alpha.3 were both published while main's CI was red, because
        # `main` has no required checks (SR-WORK-RELEASE d10). Nothing blocked
        # it. Create the release AFTER both workflows finish green on the commit;
        # while they are still running, this step refuses, and so does red.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          fail=0
          for wf in ci.yml node-arm.yml; do
            got="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/runs?head_sha=$GITHUB_SHA&event=push&branch=main&per_page=1" \
                   -q '.workflow_runs[0] | "\(.status) \(.conclusion)"')"
            echo "$wf on ${GITHUB_SHA::8}: ${got:-no run}"
            [ "$got" = "completed success" ] || fail=1
          done
          if [ "$fail" = 1 ]; then
            echo "✗ refusing to publish: CI is not green on ${GITHUB_SHA::8}. Wait for it, fix it, or re-run this job." >&2
            exit 1
          fi

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Every version site must agree
        # src/fux/__init__.py is the source, but W-107 gave the Node reader
        # three more hand-written copies. Checked here as well as on every
        # push, because this is the last moment a mismatch is still cheap.
        run: python scripts/check-version-parity.py

      - name: Release tag must match the package version
        # Guards the silent-failure mode: an unbumped __version__ would build
        # the previous version and skip-existing would "publish" nothing, green.
        run: |
          pkg="$(python -c "import sys; sys.path.insert(0, 'src'); import fux; print(fux.__version__)")"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$pkg" != "$tag" ]; then
            echo "✗ release tag v$tag != fux.__version__ $pkg — bump src/fux/__init__.py first" >&2
            exit 1
          fi
          echo "✔ tag v$tag matches __version__ $pkg"

      - name: Bundle the Node read plane — ONE build, two registries
        # 🔴 **Built here, before either registry job exists.** A bundle built
        # per-job could ship two registries disagreeing about what `2.x.y` is
        # (SR-NODE-SEARCH decision 14) — and that risk does NOT go away now that
        # both halves publish automatically, because two jobs still run on two
        # runners. One artefact, downloaded by both, is what makes them equal.
        # The wheel gets the same artefact from `hatch_build.py`, which runs the
        # same deterministic bundler over the same sources.
        run: PYTHONPATH=src python -m fux.store.nodebundle node node/dist

      - name: The bundle's version must be the engine's
        # Derived, not hand-written — so this asserts the derivation rather than
        # a fifth copy (W-149 §3.7).
        run: python scripts/check-version-parity.py --with-bundle node/dist/fux.mjs

      - uses: actions/upload-artifact@v6
        with:
          name: node-bundle
          path: node/dist/

      - name: Install build tooling
        run: pip install build twine

      - name: Build sdist + wheel
        run: python -m build

      - name: Validate distribution metadata
        run: twine check --strict dist/*

      - uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write  # OIDC trusted publishing — only this job needs it
    environment:
      name: pypi
      url: https://pypi.org/project/fux-engine/

    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: build          # the same gate PyPI waits on — one release, two registries
    permissions:
      id-token: write     # OIDC trusted publishing; no NPM_TOKEN exists anywhere
      contents: read
    # No `environment:` here, deliberately, unlike publish-pypi. The trusted
    # publisher on npmjs.com was saved with its *Environment name* field blank,
    # and the OIDC token's environment claim has to match what is configured
    # there. A GitHub environment on this job would put a claim in the token
    # that npm's config does not name. Add both together or neither.

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org

      - name: Take the bundle the build job made — never rebuild it here
        uses: actions/download-artifact@v7
        with:
          name: node-bundle
          path: node/dist/

      - name: The published tarball is the bundle, and nothing else
        # `node/dist/` holds exactly what `package.json`'s `files` names:
        # `fux.mjs` (generated), `mcp-tools.json`, `README.md`. Asserted rather
        # than assumed — a missing sidecar publishes a reader whose `fux mcp`
        # throws ENOENT on its own tool descriptions.
        run: |
          for f in fux.mjs package.json mcp-tools.json README.md; do
            test -f "node/dist/$f" || { echo "✗ node/dist/$f is missing" >&2; exit 1; }
          done
          test ! -d node/dist/src || { echo "✗ node/dist/src exists — L10" >&2; exit 1; }
          echo "✔ node/dist carries the bundle and its sidecars"

      - name: npm >= 11.5.1 (the floor trusted publishing needs)
        # setup-node ships whatever npm came with the Node line, which is a 10.x
        # on Node 22 — old enough that the OIDC exchange never happens. Pinning
        # the floor here rather than trusting the runner image is the difference
        # between a clear failure and a confusing one.
        run: |
          npm i -g npm@latest
          npm --version

      - name: Publish the tarball
        # `node/dist`, NOT `node`: the published package is the BUNDLE, and the
        # repository's `node/` is the module tree it was built from. Publishing
        # from the source directory would put `node/src/**` on npm again, which
        # is the violation L10 was written for.
        working-directory: node/dist
        # DIRECT, not staged (Arpit, 2026-09-14). This job staged until then and
        # a human approved at npmjs.com with 2FA — npm's own recommendation,
        # taken deliberately. ⚠ **It cost two releases.** `2.0.0` staged on
        # 2026-09-13 and `2.0.1` on 2026-09-14 and NEITHER was ever approved, so
        # npm's `latest` went on pointing at `2.0.0-alpha.7` from 2026-09-02
        # while PyPI moved twice. A gate nobody walks through is not a gate.
        #
        # ⚠ **This job now REQUIRES `Allow npm publish` ticked on the
        # `fux-engine` trusted publisher at npmjs.com.** With it unchecked the
        # registry refuses a direct publish and this step fails — the setting
        # lives in the npm account, not in this repository, so it cannot be
        # asserted here. That is the one thing to check if this step starts
        # failing for no reason a diff explains.
        #
        # Provenance is unchanged: `--provenance` still signs from OIDC, so what
        # reaches the registry carries the same attestation the staged tarball
        # did.
        #
        # --tag: defaults to `latest` and ERRORS on a prerelease without an
        # explicit tag, so derive it from the version rather than hardcoding
        # either answer.
        run: |
          version="$(node -p "require('./package.json').version")"
          case "$version" in
            *-*) tag=alpha ;;
            *)   tag=latest ;;
          esac
          echo "publishing fux-engine@$version with tag $tag"
          npm publish --tag "$tag" --provenance
