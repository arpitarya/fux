# The FULL lane — every supported OS, every Python and Node line, both arms.
#
# Replaced ci.yml and node-arm.yml on 2026-09-29, with fast.yml. It runs after
# code reaches `main` (PR merge or direct push), nightly, and by hand.
# 🔴 **publish.yml refuses a release unless THIS workflow completed green on the
# exact sha** — that, not a branch check, is the gate (SR-WORK-RELEASE 11a).
# The workflow's own conclusion is the aggregate, so there is no gate job.
name: main

on:
  push:
    branches: [main]
  schedule:
    # 20:30 UTC = 02:00 IST. Catches a runner-image or toolchain change that
    # breaks the build with no commit to blame.
    - cron: "30 20 * * *"
  workflow_dispatch:

concurrency:
  group: main-${{ github.ref }}
  # Never cancel: publish.yml needs a COMPLETED run on the exact sha it ships.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  python:
    # The support target: Python >= 3.12 (L7) on Linux, macOS and Windows. The
    # wheel is pure Python; these runners prove it. Full spread on Linux, the
    # version boundaries on macOS/Windows, where breakage is OS-shaped.
    name: ${{ matrix.os == 'ubuntu-latest' && 'linux' || matrix.os == 'macos-latest' && 'macos' || 'windows' }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13", "3.14"]
        exclude:
          - { os: macos-latest, python: "3.13" }
          - { os: windows-latest, python: "3.13" }
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # test_sr_freshness.py audits history
      - uses: ./.github/actions/setup-fux
        with:
          python: ${{ matrix.python }}
      - name: Unit suite
        run: pytest -q -n auto --durations=10 --junitxml=junit-unit.xml tests
      - name: End-to-end suite
        if: success() || failure()
        run: pytest -q -n auto --durations=10 --junitxml=junit-e2e.xml tests_e2e
      - if: failure()
        uses: ./.github/actions/pytest-annotate
        with:
          junit: junit-unit.xml
      - if: failure()
        uses: ./.github/actions/pytest-annotate
        with:
          junit: junit-e2e.xml

  node-arm:
    # 🔴 **A green arm on ONE OS is not a green arm.** Two libms disagree in the
    # last ulp (PRE-REGISTRATION-NODE); the OS x Node matrix is the point.
    # Each cell is split into three shards; every shard runs its third of BOTH
    # passes — this repo's index, then the adversarial corpus.
    name: ${{ matrix.os }} · node ${{ matrix.node }} · ${{ matrix.shard }}/3
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["22", "24"]
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-fux
        with:
          python: "3.13"
          node: ${{ matrix.node }}
          extras: ""

      - name: node pins
        if: matrix.shard == 1
        working-directory: node
        run: node --test

      # 🔴 Build the derived plane first — without it Python has no graph tier
      # and Node does, and the two disagree by ratified design.
      - run: fux build

      - name: the differential arm — TRANSCRIPTION (this repo)
        run: python tools/differential/node_arm.py . --python-tune off --shard ${{ matrix.shard }}/3

      - name: the adversarial corpus, then the arm again
        # W-107 H1/H2 are invisible on ordinary data: H1 needs tied scores whose
        # ids straddle U+FFFF. `adversarial_corpus.py` REWRITES .fux/index/, so
        # the plane built above goes stale — hence `fux build` again.
        shell: bash
        run: |
          python tools/differential/adversarial_corpus.py .
          fux build
          python tools/differential/node_arm.py . --python-tune off --shard ${{ matrix.shard }}/3

      - name: N2 — the graph plane digest (adversarial index)
        if: matrix.shard == 1
        run: python tools/differential/graph_arm.py .

  ladder:
    # 🔴 THE GOLDEN CORPUS IS NOT FOR CI (Arpit, 2026-09-14, W-148 row 1): it
    # runs local-only, in fux-lab. This checks the manifests and nothing else.
    name: golden ladder manifests (the corpus is local-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-fux
        with:
          python: "3.13"
          extras: ""
      - run: python tools/differential/ladder_check.py
