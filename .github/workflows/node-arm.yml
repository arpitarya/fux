# The third arm of the differential law — W-107.
#
# 🔴 **A green arm on ONE OS is not a green arm.** The whole reason
# PRE-REGISTRATION-NODE exists is that two libms disagree in the last ulp, so
# running the arm on one of them measures nothing about the other. The matrix
# is the point of this file.
name: node-arm

on:
  push:
  pull_request:

jobs:
  differential:
    name: ${{ matrix.os }} · node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['20', '22']

    steps:
      - uses: actions/checkout@v4
        with:
          # `tests/test_sr_freshness.py` audits history, and the arm reads the
          # committed index; neither works on a shallow clone.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: install fux
        run: pip install -e .

      - name: node pins (no Python — a Node-only contributor sees these fail)
        # ⚠ `node --test node/test/` — a bare DIRECTORY argument — is resolved
        # as a module by Node 24 and dies `MODULE_NOT_FOUND` (measured
        # 2026-09-12, node 22.13/24.13 on darwin). `working-directory` + a bare
        # `node --test` uses the built-in discovery pattern instead, which is
        # stable across 20/22/24 and needs no shell glob — the matrix includes
        # windows, where pwsh would not expand one.
        working-directory: node
        run: node --test

      - name: build the derived plane — the arm is meaningless without it
        # 🔴 **A fresh checkout has no `.fux/runtime/`, and that alone makes the
        # arm red.** W-161's graph tier reads Python's derived
        # `.fux/runtime/graph.json`; Node has no such file and rebuilds the plane
        # in memory from the committed records instead (SR-NODE-SEARCH decisions
        # 9 and 16). So Python with no fresh plane has NO TIER and Node has one,
        # and the two disagree **by ratified design** — measured here at **44 of
        # 202 discordant** on 2026-09-16, every one of them that asymmetry.
        #
        # `compose.mjs` says the readers are byte-equal "wherever Python has a
        # fresh plane — which is every corpus the differential arm runs on,
        # because the golden ladder rungs are built". That was true of the
        # ladder and was never true of THIS repo in CI, where nothing built
        # anything. `fux build` is what makes the sentence true here.
        run: fux build

      - name: the differential arm — TRANSCRIPTION (this repo)
        # ⚠ `--python-tune off` is deliberate and is not a loosened bar.
        #
        # This repo's own `.fux/tune.toml` sets `rerank_weight = 0.3`, and
        # **Node reads no tune.toml at all** — `node/src/config/` holds
        # `root.mjs` and nothing else, so W-107 R5's tune row is unbuilt and
        # `rerank.mjs` is still owed by Phase 2. Against a tuned Python the two
        # readers differ on 90 of 174 comparisons here, every one of them the
        # same missing multiplier.
        #
        # So CI runs the arm that can attribute a failure: `--no-tune` on the
        # Python side is *the engine's own answer* (SR-TUNE decision 11),
        # which is exactly what Node implements.
        #
        # ⚠ **This comment read "a discordance in this step is a Node
        # transcription defect and nothing else" until 2026-09-16, and W-161
        # made that false.** The graph tier gave the two readers a second,
        # LEGITIMATE way to differ — Python's derived plane against Node's
        # in-memory one — which the step cannot tell from a transcription
        # defect. The `fux build` above removes that second way rather than
        # documenting it, so the sentence is true again *because of the step
        # before it*, not on its own.
        #
        # 🔴 The CONTRACT arm — tune applied — runs on the golden rungs, whose
        # tune is all-defaults, so there the two arms are the same run. See the
        # `ladder` job below.
        run: python tools/differential/node_arm.py . --python-tune off

      - name: the adversarial corpus, then the arm again
        # W-107 H1 and H2 are invisible on ordinary data: H1 needs two
        # documents whose scores tie exactly AND whose ids straddle U+FFFF,
        # and no real corpus has been written to contain one.
        #
        # ⚠ **`fux build` again, and for the same reason.** `adversarial_corpus.py`
        # REWRITES `.fux/index/`, which leaves the plane built above stale — and
        # `compose.py` has no tier on a stale plane exactly as it has none on an
        # absent one, so skipping this rebuild puts the divergence straight back.
        run: |
          python tools/differential/adversarial_corpus.py .
          fux build
          python tools/differential/node_arm.py . --python-tune off

      - name: N2 — the graph plane digest
        # ⚠ Runs against the ADVERSARIAL index the step above wrote, not the
        # committed one. That is deliberate: both readers see the same shards
        # either way, so the digest comparison is still a comparison — and the
        # adversarial corpus is where an id above U+FFFF actually exists.
        run: python tools/differential/graph_arm.py .

  ladder:
    # 🔴 **THE GOLDEN CORPUS IS NOT FOR CI.** Ruled by Arpit on 2026-09-14
    # (W-148 row 1): golden runs **local-only, in `fux-lab`** — no self-hosted
    # runner, no committed rung, no portable builder. The three routes out were
    # named and none was taken.
    #
    # So this job checks the **manifests and nothing else**: `ladder_check.py`
    # proves `rungs.py` resolves and verifies what `work/golden/ladder/` holds
    # (2.2 MB of `*.{index,sha256}`), which is the half CI can honestly do.
    #
    # ⚠ **The `FUX_GOLDEN_CORPORA` arm was here and is REMOVED**, not disabled.
    # It ran the real differential arm whenever a repository variable happened
    # to point at a corpus — so the cadence PRE-REG-NODE-2 §4 asks for was
    # *conditionally* met by a setting nobody could see from the tree, and a
    # green tick meant either "the arm passed" or "there was no corpus". A
    # conditional arm that skips silently is how `find` went a month without
    # its tune file. **The cadence is LOCAL**, stated in the pre-registration
    # rather than implied by a variable.
    #
    # [SR-WORK-ENVIRONMENTS]: records/0052_WORK-environments.md
    name: golden ladder manifests (the corpus is local-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: install fux
        run: pip install -e .

      - name: the ladder manifests are readable and self-consistent
        run: python tools/differential/ladder_check.py

