<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 760" font-family="ui-monospace, 'SF Mono', Menlo, monospace">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#5f6b7a" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#3d6df2" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#0f9d58" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
  </defs>

  <rect width="1080" height="760" fill="#fafafa"/>
  <text x="36" y="40" font-size="18" fill="#1a1f27" font-weight="600">Fux v0.30 — how it works (plan revision 2, 2026-08-09)</text>
  <text x="36" y="58" font-size="10.5" fill="#8a93a0">full postings (ADR-0003) · tiered JSONL (index-format compare) · git is the Merkle tree · blue = committed · gray = derived, disposable</text>

  <!-- SOURCES -->
  <rect x="36" y="78" width="230" height="150" rx="10" fill="#fff" stroke="#c9cfd8"/>
  <text x="52" y="100" font-size="11.5" fill="#1a1f27" font-weight="600">SOURCES own content</text>
  <rect x="52" y="112" width="198" height="36" rx="6" fill="#f4f4f6" stroke="#c9cfd8"/>
  <text x="60" y="127" font-size="10" fill="#1a1f27">repo dirs — docs/ adr/ README</text>
  <text x="60" y="140" font-size="9" fill="#8a93a0">M1 · local read, free</text>
  <rect x="52" y="154" width="198" height="36" rx="6" fill="#f4f4f6" stroke="#c9cfd8"/>
  <text x="60" y="169" font-size="10" fill="#1a1f27">HTTP · Confluence</text>
  <text x="60" y="182" font-size="9" fill="#8a93a0">M4 · capped; MCP is the endgame</text>
  <text x="52" y="212" font-size="9" fill="#8a93a0">no text is ever stored in the index —</text>
  <text x="52" y="224" font-size="9" fill="#8a93a0">content is fetched live when cited</text>

  <!-- INGEST -->
  <line x1="266" y1="150" x2="304" y2="150" stroke="#5f6b7a" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="308" y="78" width="240" height="150" rx="10" fill="#fff" stroke="#c9cfd8"/>
  <text x="324" y="100" font-size="11.5" fill="#1a1f27" font-weight="600">fux ingest — extract, discard</text>
  <text x="324" y="120" font-size="9.5" fill="#1a1f27">transient convert → per doc:</text>
  <text x="332" y="136" font-size="9.5" fill="#1a1f27">terms (16-hex hashes) + wlen</text>
  <text x="332" y="150" font-size="9.5" fill="#1a1f27">title · phrases · edges · code(32 B)</text>
  <text x="324" y="170" font-size="9" fill="#8a93a0">deterministic: NFC, sorted, no floats,</text>
  <text x="324" y="182" font-size="9" fill="#8a93a0">no clocks · incremental by sha</text>
  <rect x="324" y="192" width="208" height="26" rx="6" fill="#e8f5ee" stroke="#0f9d58"/>
  <text x="332" y="203" font-size="9" fill="#1a1f27">M5: git hooks re-emit changed lines;</text>
  <text x="332" y="214" font-size="9" fill="#1a1f27">merge driver = line-wise LWW (ver, sha)</text>

  <!-- COMMITTED INDEX -->
  <line x1="548" y1="150" x2="586" y2="150" stroke="#3d6df2" stroke-width="1.6" marker-end="url(#b)"/>
  <rect x="590" y="78" width="454" height="228" rx="10" fill="#eef3fd" stroke="#3d6df2"/>
  <text x="606" y="100" font-size="11.5" fill="#3d6df2" font-weight="600">THE COMMITTED INDEX · .fux/index/{00..ff}.jsonl · in git</text>
  <text x="606" y="114" font-size="9" fill="#8a93a0">doc-major: one canonical JSON line per document · header line pins schema+analyzer</text>

  <rect x="606" y="124" width="422" height="92" rx="6" fill="#fff" stroke="#c9cfd8"/>
  <text x="614" y="140" font-size="8.6" fill="#52514e">{"id":"file:docs/api/webhooks.md","src":"git","loc":"docs/api/webhooks.md",</text>
  <text x="614" y="153" font-size="8.6" fill="#52514e"> "sha":"9f2c41ab…","ver":1,"mode":"refer","meta":"plain","title":"Webhooks",</text>
  <text x="614" y="166" font-size="8.6" fill="#52514e"> "wlen":[12,1840],"community":17,"code":"pU3KGCUw…(base64, 32 B)",</text>
  <text x="614" y="179" font-size="8.6" fill="#52514e"> "terms":{"05a9c3061b8ee402":[3,15],"52b96e14d0a71c88":[2,5],…FULL postings},</text>
  <text x="614" y="192" font-size="8.6" fill="#52514e"> "edges":[["ref","file:docs/adr/0013-…",10],["tag","tag:payments",10]]}</text>
  <text x="614" y="208" font-size="8.4" fill="#8a93a0">binary rides as properties: code · (T2) tpack — same record, one field swaps</text>

  <text x="606" y="234" font-size="9.5" fill="#1a1f27">git IS the Merkle tree: doc edit = 1-line diff · merge = line replace ·</text>
  <text x="606" y="247" font-size="9.5" fill="#1a1f27">corpus state = one tree hash · measured: 1-line edit in a 138 MB shard ≈ free</text>
  <text x="606" y="266" font-size="9" fill="#8a93a0">meta policy: git sources plain · external hashed (title_h, no phrases) — ACL containment</text>
  <text x="606" y="290" font-size="9.5" fill="#3d6df2" font-weight="600">size @100k target-density ≈ 170 MB git-packed (R7 ≤ 250 MB)</text>

  <!-- DERIVED -->
  <line x1="817" y1="306" x2="817" y2="336" stroke="#5f6b7a" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="828" y="326" font-size="9" fill="#8a93a0">derive (seconds · gitignored · disposable)</text>
  <rect x="590" y="340" width="454" height="118" rx="10" fill="#f4f4f6" stroke="#9aa3af" stroke-dasharray="5 4"/>
  <text x="606" y="362" font-size="11.5" fill="#5f6b7a" font-weight="600">DERIVED ACCELERATOR · .fux/derived/ · never committed</text>
  <rect x="606" y="372" width="422" height="30" rx="6" fill="#fff" stroke="#c9cfd8"/>
  <text x="614" y="384" font-size="8.6" fill="#52514e">{"t":"52b96e14d0a71c88","b":0,"mx":11,"df":3,"p":[[41,2,5],[55,2,9],…≤128]}</text>
  <text x="614" y="396" font-size="8.4" fill="#8a93a0">term-major · sorted · 128-posting blocks · integer mx = block-max</text>
  <text x="606" y="420" font-size="9.5" fill="#1a1f27">bisect via offset table (2 MB, 0.1 s build) · mx read w/o parsing → skip blocks</text>
  <text x="606" y="434" font-size="9.5" fill="#1a1f27">law: accelerator results ≡ scan results, byte-for-byte (differential test)</text>
  <text x="606" y="450" font-size="9" fill="#8a93a0">+ int-cached Hamming lane (M2) · CSR graph + PPR (M3) · T2: mmap segments (M6)</text>

  <!-- QUERY PATH -->
  <rect x="36" y="478" width="1008" height="180" rx="12" fill="#fff" stroke="#c9cfd8"/>
  <text x="52" y="502" font-size="11.5" fill="#1a1f27" font-weight="600">fux ask "why exponential backoff?"</text>

  <rect x="52" y="516" width="150" height="56" rx="7" fill="#f4f4f6" stroke="#c9cfd8"/>
  <text x="127" y="537" font-size="10.5" fill="#1a1f27" text-anchor="middle">hash query terms</text>
  <text x="127" y="551" font-size="9" fill="#8a93a0" text-anchor="middle">blake2b 16-hex —</text>
  <text x="127" y="562" font-size="9" fill="#8a93a0" text-anchor="middle">same space as the index</text>

  <line x1="202" y1="544" x2="240" y2="544" stroke="#5f6b7a" stroke-width="1.4" marker-end="url(#a)"/>

  <rect x="244" y="516" width="216" height="56" rx="7" fill="#eef3fd" stroke="#3d6df2"/>
  <text x="352" y="533" font-size="10.5" fill="#1a1f27" text-anchor="middle">rank — tier picks the path</text>
  <text x="352" y="547" font-size="8.8" fill="#8a93a0" text-anchor="middle">T0 cold: prefilter scan (191 ms@5k)</text>
  <text x="352" y="559" font-size="8.8" fill="#8a93a0" text-anchor="middle">T1: bisect+mx (0.035–44 ms) · BM25F+RRF</text>

  <line x1="460" y1="544" x2="498" y2="544" stroke="#5f6b7a" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="479" y="536" font-size="8.5" fill="#5f6b7a" text-anchor="middle">top-k</text>

  <rect x="502" y="516" width="180" height="56" rx="7" fill="#f4f4f6" stroke="#c9cfd8"/>
  <text x="592" y="533" font-size="10.5" fill="#1a1f27" text-anchor="middle">fetch cited docs live</text>
  <text x="592" y="547" font-size="8.8" fill="#8a93a0" text-anchor="middle">src/loc → git read · API GET</text>
  <text x="592" y="559" font-size="8.8" fill="#8a93a0" text-anchor="middle">ARC cache (loc, sha) · M4</text>

  <line x1="682" y1="544" x2="720" y2="544" stroke="#5f6b7a" stroke-width="1.4" marker-end="url(#a)"/>

  <rect x="724" y="516" width="170" height="56" rx="7" fill="#f4f4f6" stroke="#c9cfd8"/>
  <text x="809" y="533" font-size="10.5" fill="#1a1f27" text-anchor="middle">re-score passages</text>
  <text x="809" y="547" font-size="8.8" fill="#8a93a0" text-anchor="middle">on the fetched text —</text>
  <text x="809" y="559" font-size="8.8" fill="#8a93a0" text-anchor="middle">the index only found it</text>

  <line x1="894" y1="544" x2="932" y2="544" stroke="#3d6df2" stroke-width="1.6" marker-end="url(#b)"/>

  <rect x="936" y="516" width="92" height="56" rx="7" fill="#eef3fd" stroke="#3d6df2"/>
  <text x="982" y="537" font-size="10.5" fill="#1a1f27" text-anchor="middle">answer</text>
  <text x="982" y="551" font-size="8.8" fill="#8a93a0" text-anchor="middle">cited · fresh</text>
  <text x="982" y="562" font-size="8.8" fill="#8a93a0" text-anchor="middle">sha checked</text>

  <text x="52" y="596" font-size="9" fill="#8a93a0">freshness: live sha vs indexed sha at answer time → verified, or that one doc re-ingested · offline: repo sources full function, external → declared staleness</text>
  <text x="52" y="614" font-size="9" fill="#8a93a0">cold clone answers immediately by scan — the accelerator is an optimization, never a prerequisite</text>
  <text x="52" y="640" font-size="9.5" fill="#1a1f27" font-weight="600">tiers: T0 ≤~20k docs — scan only · T1 ≤~200k — blocked accelerator · T2 beyond — terms→tpack, mmap segments, partial clone, external-shards-only</text>

  <!-- footer -->
  <text x="36" y="688" font-size="9.5" fill="#8a93a0">build order: M0 scaffold → M1 T0 slice (committed store + scan ask, dogfood + AcmePay playground) → M2 T1 accelerator → M3 graph → M4 refer → M5 maintenance → M6 scale/T2 → M7 dogfood gate</text>
  <text x="36" y="706" font-size="9.5" fill="#8a93a0">measured basis: bisect 0.035 ms · worst common term 44 ms (mx-skip) · 1-line edit in 138 MB shard deltas ≈ 0 · git pack ×0.38 · pruning FAIL → full postings (ADR-0003)</text>
  <text x="36" y="724" font-size="9.5" fill="#b8860b">predictions R1–R7 in PLAN rev 2 · rev-1 diagrams archived at archive/v0.30-rev1-planning/</text>
</svg>
