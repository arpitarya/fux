[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "fux-engine"
dynamic = ["version"]
description = "Fux — rank your written knowledge (decisions, runbooks, specs, wikis) from a small index committed to git; fetch content from the systems that own it; verify freshness at answer time."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "arpit arya", email = "arpitarya.me@gmail.com" }]
keywords = ["knowledge", "documentation", "search", "index", "bm25", "adr", "runbook", "frontmatter", "agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Documentation",
    "Topic :: Text Processing :: Indexing",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
# L2: OSI-approved licences only, ever — source-available (BSL, SSPL, Elastic
# v2, Commons Clause) does NOT qualify. Fux ships packaged: no feature-extras tier. Anything on the ingest path is pinned: byte-identity is a
# function of what resolves here. See CLAUDE.md and records/0004_LAW-2-zero-cost.md.
# W-282: fux-engine is the one install of everything — the three role
# packages, pinned to this release's one version (held equal by
# scripts/check-version-parity.py), plus the engine's own verbs.
dependencies = ["fux-core==4.1.0", "fux-reader==4.1.0", "fux-writer==4.1.0"]

[project.urls]
Homepage = "https://github.com/arpitarya/fux"
Repository = "https://github.com/arpitarya/fux"
"Bug Tracker" = "https://github.com/arpitarya/fux/issues"

# No console scripts here since W-282: `fux` ships in fux-core (cli.py is core
# and dispatches by layer) and `fux-merge-index` in fux-writer — one owning
# distribution per script, and every install that needs one carries it. See
# packages/fux-core/pyproject.toml and packages/fux-writer/pyproject.toml.

[project.optional-dependencies]
# hatchling: the e2e suite builds the four wheels offline (W-282 DoD 10).
dev = ["pytest>=8", "pytest-xdist>=3", "hatchling>=1.25"]

[tool.hatch.version]
path = "src/fux/__init__.py"

[tool.hatch.build.targets.wheel]
# W-282: the engine's wheel carries the ENGINE layer only (records/README.md
# §The layer map, read by the hook); core, reader and writer arrive as the
# three dependencies above. Installed together they are the same files one
# wheel carried before. An editable install puts the whole src/ on the path.
#
# The Node read plane's bundle travels in fux-writer's wheel, beside `fux setup`
# which vendors it (SR-NODE-SEARCH decision 13): one generated `.mjs` plus its
# sidecars, built at publish (L10).
bypass-selection = true
dev-mode-dirs = ["src"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "packages/layer_hook.py"
layer = "engine"

[tool.hatch.build.targets.sdist]
# The sdist is the buildable source + its tests/docs — never the archived old
# build, lockfile, or CI plumbing.
exclude = ["/archive", "/uv.lock", "/.github", "/scripts", "/.DS_Store", "**/.DS_Store"]

[tool.ruff]
line-length = 100
# The consumer-copy dotdirs (fetchers, decoders) are Python a hidden path hides
# from a glob; ruff is not a dev dependency (stdlib-only gate in
# tests/test_dotdir_hygiene.py), this is for whoever runs it.
extend-include = [".fux/fetchers/*.py", ".fux/decoders/*.py"]

# W-282: the four distributions are one uv workspace. `uv sync --extra dev`
# installs all four from this tree; pip needs them on one command line:
#   pip install -e packages/fux-core -e packages/fux-reader -e packages/fux-writer -e ".[dev]"
[tool.uv.workspace]
members = ["packages/fux-core", "packages/fux-reader", "packages/fux-writer"]

[tool.uv.sources]
fux-core = { workspace = true }
fux-reader = { workspace = true }
fux-writer = { workspace = true }
