[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "fux-engine"
dynamic = ["version"]
description = "Fux — rank your written knowledge (decisions, runbooks, specs, wikis) from a small index committed to git; fetch content from the systems that own it; verify freshness at answer time."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "arpit arya", email = "arpitarya.me@gmail.com" }]
keywords = ["knowledge", "documentation", "search", "index", "bm25", "adr", "runbook", "frontmatter", "agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Documentation",
    "Topic :: Text Processing :: Indexing",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
# L2: OSI-approved licences only, ever — source-available (BSL, SSPL, Elastic
# v2, Commons Clause) does NOT qualify. Fux ships packaged: no feature-extras tier. Anything on the ingest path is pinned: byte-identity is a
# function of what resolves here. See CLAUDE.md and records/0004_LAW-2-zero-cost.md.
# W-282: fux-engine is the one install of everything — the three role
# packages, pinned to this release's one version (held equal by
# scripts/check-version-parity.py), plus the engine's own verbs.
dependencies = ["fux-core==5.1.1", "fux-reader==5.1.1", "fux-writer==5.1.1"]

[project.urls]
Homepage = "https://github.com/arpitarya/fux"
Repository = "https://github.com/arpitarya/fux"
"Bug Tracker" = "https://github.com/arpitarya/fux/issues"

# No console scripts here since W-282: `fux` ships in fux-core (cli.py is core
# and dispatches by layer) and `fux-merge-index` in fux-writer — one owning
# distribution per script, and every install that needs one carries it. See
# packages/fux-core/pyproject.toml and packages/fux-writer/pyproject.toml.

[project.optional-dependencies]
# hatchling: the e2e suite builds the four wheels offline (W-282 DoD 10).
# W-289: the fifteen plugin packages are DEV tooling here, so the tests can
# import them from this tree. fux-engine itself depends on none of them — a
# repository declares the ones it needs in `.fux/plugins.toml` (SR-PLUGINS).
dev = [
    "pytest>=8", "pytest-xdist>=3", "hatchling>=1.27",
    "fux-decoder-config",
    "fux-decoder-drawio",
    "fux-decoder-html",
    "fux-decoder-image",
    "fux-decoder-json",
    "fux-decoder-mail",
    "fux-decoder-office",
    "fux-decoder-pdf",
    "fux-decoder-rtf",
    "fux-decoder-sheet",
    "fux-decoder-svg",
    "fux-decoder-xml",
    "fux-extension-table",
    "fux-fetcher-cdp",
    "fux-fetcher-http",
]

[tool.hatch.version]
path = "src/fux/__init__.py"

[tool.hatch.build.targets.wheel]
# W-282: the engine's wheel carries the ENGINE layer only (records/README.md
# §The layer map, read by the hook); core, reader and writer arrive as the
# three dependencies above. Installed together they are the same files one
# wheel carried before. An editable install puts the whole src/ on the path.
#
# No wheel carries the Node read plane's bundle (W-292, Arpit 2026-10-21): it
# ships on npm alone, as `fux-engine` and `@fux-engine/reader`.
bypass-selection = true
dev-mode-dirs = ["src"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "packages/layer_hook.py"
layer = "engine"

[tool.hatch.build.targets.sdist]
# The sdist is the buildable source + its tests/docs — never the archived old
# build, lockfile, or CI plumbing. Nor the measured runs (work/regression), the
# golden sets or a local runtime: 5.1.1's sdist crossed PyPI's 100 MB project
# limit with them in (2026-10-26).
exclude = ["/archive", "/uv.lock", "/.github", "/scripts", "/.DS_Store", "**/.DS_Store",
           "/work/regression", "/work/golden", "/.fux/runtime"]

[tool.ruff]
line-length = 100
# The consumer-copy dotdirs (fetchers, decoders) are Python a hidden path hides
# from a glob; ruff is not a dev dependency (stdlib-only gate in
# tests/test_dotdir_hygiene.py), this is for whoever runs it.
extend-include = [".fux/fetchers/*.py", ".fux/decoders/*.py"]

# W-282: the four distributions are one uv workspace; W-289 adds fifteen. `uv sync --extra dev`
# installs all four from this tree; pip needs them on one command line:
#   pip install -e packages/fux-core -e packages/fux-reader -e packages/fux-writer \
#       -e packages/fux-<each plugin> ... -e ".[dev]"
[tool.uv.workspace]
members = [
    "packages/fux-core", "packages/fux-reader", "packages/fux-writer",
    # W-289: the fifteen plugin packages (SR-PLUGINS), one directory each.
    "packages/fux-decoder-*", "packages/fux-fetcher-*", "packages/fux-extension-table",
]

[tool.uv.sources]
fux-core = { workspace = true }
fux-reader = { workspace = true }
fux-writer = { workspace = true }
fux-decoder-config = { workspace = true }
fux-decoder-drawio = { workspace = true }
fux-decoder-html = { workspace = true }
fux-decoder-image = { workspace = true }
fux-decoder-json = { workspace = true }
fux-decoder-mail = { workspace = true }
fux-decoder-office = { workspace = true }
fux-decoder-pdf = { workspace = true }
fux-decoder-rtf = { workspace = true }
fux-decoder-sheet = { workspace = true }
fux-decoder-svg = { workspace = true }
fux-decoder-xml = { workspace = true }
fux-extension-table = { workspace = true }
fux-fetcher-cdp = { workspace = true }
fux-fetcher-http = { workspace = true }
