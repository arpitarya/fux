<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect width="720" height="340" fill="#fcfcfb"/>
  <text x="24" y="30" font-size="14" fill="#0b0b0b" font-weight="600">Figure 3 — Answer-latency budget: warm cache vs cold external fetch</text>
  <text x="24" y="47" font-size="11" fill="#52514e">Stage estimates at 1M docs. Rank and re-score are fetch-independent; only the fetch stage differs.</text>

  <!-- x scale 0..1800ms → 0..500px from x0=170 ; px = ms*0.2778 -->
  <g stroke="#e1e0d9" stroke-width="1">
    <line x1="170" y1="70" x2="170" y2="230"/>
    <line x1="309" y1="70" x2="309" y2="230"/>
    <line x1="448" y1="70" x2="448" y2="230"/>
    <line x1="587" y1="70" x2="587" y2="230"/>
    <line x1="670" y1="70" x2="670" y2="230"/>
  </g>
  <g font-size="10" fill="#898781" text-anchor="middle">
    <text x="170" y="246">0</text>
    <text x="309" y="246">500 ms</text>
    <text x="448" y="246">1000 ms</text>
    <text x="587" y="246">1500 ms</text>
    <text x="670" y="246">1800</text>
  </g>

  <g font-size="11" fill="#0b0b0b" text-anchor="end">
    <text x="160" y="105">warm</text>
    <text x="160" y="185">cold</text>
  </g>

  <!-- warm: rank 110ms (30.6px), fetch 8ms (2.2px), rescore 100ms (27.8px) total 218 -->
  <g>
    <rect x="170" y="88" width="30.6" height="26" rx="4" fill="#2a78d6"/>
    <rect x="202.6" y="88" width="3" height="26" fill="#eb6834"/>
    <rect x="207.6" y="88" width="27.8" height="26" rx="4" fill="#1baf7a"/>
    <text x="243" y="105" font-size="10.5" fill="#52514e">≈ 220 ms total</text>
  </g>

  <!-- cold: rank 110 (30.6), fetch 1500 (416.7), rescore 100 (27.8) total 1710 -->
  <g>
    <rect x="170" y="168" width="30.6" height="26" rx="4" fill="#2a78d6"/>
    <rect x="202.6" y="168" width="416.7" height="26" rx="4" fill="#eb6834"/>
    <rect x="621.3" y="168" width="27.8" height="26" rx="4" fill="#1baf7a"/>
    <text x="655" y="185" font-size="10.5" fill="#52514e">≈ 1.7 s</text>
    <text x="410" y="185" font-size="10.5" fill="#fcfcfb" text-anchor="middle">live fetch (parallel, k=10) — first ask only; ARC-cached after</text>
  </g>

  <!-- legend -->
  <g font-size="10.5" fill="#52514e">
    <rect x="100" y="278" width="12" height="12" rx="3" fill="#2a78d6"/><text x="118" y="288">rank (MaxScore + Hamming + PPR → RRF)</text>
    <rect x="368" y="278" width="12" height="12" rx="3" fill="#eb6834"/><text x="386" y="288">fetch (cache / live)</text>
    <rect x="518" y="278" width="12" height="12" rx="3" fill="#1baf7a"/><text x="536" y="288">passage re-score</text>
  </g>
  <text x="24" y="322" font-size="10" fill="#898781">Baseline for comparison: the current load-everything path measures 10,570 ms at one-tenth this corpus (ADR-0011).</text>
</svg>
