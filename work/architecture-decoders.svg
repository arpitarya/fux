<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 1266" width="1140" height="1266" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10" fill="none" stroke="#3d6df2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10" fill="none" stroke="#1d8a5e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10" fill="none" stroke="#8a93a0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10" fill="none" stroke="#c2410c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="1140" height="1266" fill="#fcfcfb"/>
<text x="46" y="52" font-size="23" font-weight="600" fill="#14181f">How decoders work</text>
<text x="46" y="76" font-size="13" fill="#626b78">A decoder turns bytes fux cannot read into Markdown it can. Consumer-owned, one module per format.</text>
<rect x="760" y="34" width="340" height="68" rx="8" fill="#ffffff" stroke="#c9cfd8" stroke-width="1.4"/>
<rect x="772" y="44" width="10" height="10" rx="2.5" fill="#eef3fd" stroke="#3d6df2" stroke-width="1.4"/>
<text x="790" y="53" font-size="11" fill="#626b78">committed to your repo</text>
<rect x="772" y="58" width="10" height="10" rx="2.5" fill="#ffffff" stroke="#c9cfd8" stroke-width="1.4"/>
<text x="790" y="67" font-size="11" fill="#626b78">engine-side</text>
<rect x="772" y="72" width="10" height="10" rx="2.5" fill="#eaf7f0" stroke="#1d8a5e" stroke-width="1.4"/>
<text x="790" y="81" font-size="11" fill="#626b78">order is load-bearing (sha before redaction)</text>
<rect x="772" y="86" width="10" height="10" rx="2.5" fill="#fff4ec" stroke="#c2410c" stroke-width="1.4"/>
<text x="790" y="95" font-size="11" fill="#626b78">refusal / queued</text>

<text x="46" y="126" font-size="11" fill="#9aa3af" font-weight="600" letter-spacing="1.1">1 - WHICH DECODER READS THIS EXTENSION</text>
<line x1="46" y1="136" x2="1096" y2="136" stroke="#e4e4e0" stroke-width="1"/>
<rect x="46" y="146" width="330" height="192" rx="10" fill="#ffffff" stroke="#c9cfd8" stroke-width="1.4"/>
<text x="66" y="172" font-size="13" fill="#14181f" font-weight="600">Built-in</text>
<text x="66" y="192" font-size="11.5" fill="#4a5260">17 modules in fux.decode, named in</text>
<text x="66" y="208" font-size="11.5" fill="#4a5260">constants.toml [decoders].builtin --</text>
<text x="66" y="224" font-size="11.5" fill="#4a5260">never a directory scan, because</text>
<text x="66" y="240" font-size="11.5" fill="#4a5260">filesystem order would reach the</text>
<text x="66" y="256" font-size="11.5" fill="#4a5260">index (L4). Stdlib-only (L2).</text>
<text x="66" y="282" font-size="10.5" fill="#626b78" font-family="ui-monospace, Menlo, monospace">csv docx drawio html image ini json</text>
<text x="66" y="298" font-size="10.5" fill="#626b78" font-family="ui-monospace, Menlo, monospace">jsonl mail pdf pptx rtf svg toml xlsx</text>
<text x="66" y="314" font-size="10.5" fill="#626b78" font-family="ui-monospace, Menlo, monospace">xml yaml</text>
<rect x="406" y="146" width="330" height="192" rx="10" fill="#eef3fd" stroke="#3d6df2" stroke-width="1.8"/>
<text x="426" y="172" font-size="13" fill="#14181f" font-weight="600" font-family="ui-monospace, Menlo, monospace">.fux/decoders/*.py</text>
<text x="426" y="192" font-size="11.5" fill="#4a5260" font-weight="600">THESE COPIES ARE WHAT RUN.</text>
<text x="426" y="210" font-size="11.5" fill="#4a5260">fux setup copies the built-ins here;</text>
<text x="426" y="226" font-size="11.5" fill="#4a5260">a module of the same name replaces</text>
<text x="426" y="242" font-size="11.5" fill="#4a5260">the built-in wholesale, matched by</text>
<text x="426" y="258" font-size="11.5" fill="#4a5260">MODULE NAME, not by extension --</text>
<text x="426" y="274" font-size="11.5" fill="#4a5260">two files claiming .html would race.</text>
<text x="426" y="298" font-size="11" fill="#626b78">_helper.py is skipped. prose.py is REFUSED:</text>
<text x="426" y="314" font-size="11" fill="#626b78">prose names a branch (already text), not a module.</text>
<rect x="766" y="146" width="330" height="192" rx="10" fill="#eef3fd" stroke="#3d6df2" stroke-width="1.8"/>
<text x="786" y="172" font-size="13" fill="#14181f" font-weight="600" font-family="ui-monospace, Menlo, monospace">formats.toml [decoders]</text>
<text x="786" y="192" font-size="11.5" fill="#4a5260" font-family="ui-monospace, Menlo, monospace">geojson = "json"</text>
<text x="786" y="212" font-size="11.5" fill="#4a5260" font-weight="600">Wins over both -- and is CHECKED.</text>
<text x="786" y="234" font-size="11.5" fill="#4a5260">Extending is allowed: claim an</text>
<text x="786" y="250" font-size="11.5" fill="#4a5260">extension nobody claims.</text>
<text x="786" y="270" font-size="11.5" fill="#c2410c">Redirecting is REFUSED: csv = "json"</text>
<text x="786" y="286" font-size="11.5" fill="#626b78">raises, naming both modules. A typo</text>
<text x="786" y="302" font-size="11.5" fill="#626b78">indexes nothing; a redirect lies.</text>
<text x="786" y="322" font-size="11" fill="#626b78">[meta] outranks META_FIELDS the same way.</text>
<path d="M380,246 L402,246" fill="none" stroke="#3d6df2" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M740,246 L762,246" fill="none" stroke="#3d6df2" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="360" y="223" width="62" height="17" rx="5" fill="#fcfcfb" stroke="none"/>
<text x="391" y="235" font-size="10.5" fill="#626b78" text-anchor="middle">replaces</text>
<rect x="729" y="223" width="44" height="17" rx="5" fill="#fcfcfb" stroke="none"/>
<text x="751" y="235" font-size="10.5" fill="#626b78" text-anchor="middle">binds</text>
<rect x="46" y="352" width="1050" height="52" rx="8" fill="#ffffff" stroke="#c9cfd8" stroke-width="1.4"/>
<text x="66" y="373" font-size="11.5" fill="#14181f" font-weight="600">A URL line names its decoder by STEM (decoder=xlsx) and resolves through steps 1 and 2 only.</text>
<text x="66" y="391" font-size="11" fill="#4a5260">A [decoders] binding is extension -&gt; module; it never re-routes a line. The URL half of the pipe is architecture-fetchers.svg.</text>

<text x="46" y="446" font-size="11" fill="#9aa3af" font-weight="600" letter-spacing="1.1">2 - THE PROTOCOL A DECODER IMPLEMENTS</text>
<line x1="46" y1="456" x2="1096" y2="456" stroke="#e4e4e0" stroke-width="1"/>
<rect x="46" y="466" width="560" height="194" rx="10" fill="#ffffff" stroke="#c9cfd8" stroke-width="1.4"/>
<text x="66" y="492" font-size="11.5" fill="#14181f" font-family="ui-monospace, Menlo, monospace">EXTENSIONS = (".html", ".htm")</text>
<text x="330" y="492" font-size="11" fill="#8a93a0" font-family="ui-monospace, Menlo, monospace"># required; lowercase, with the dot</text>
<text x="66" y="512" font-size="11.5" fill="#14181f" font-family="ui-monospace, Menlo, monospace">def decode(raw: bytes, rel_path: str) -&gt; str | None: ...</text>
<text x="66" y="540" font-size="11" fill="#626b78" font-family="ui-monospace, Menlo, monospace">WANTS_PATH = True</text>
<text x="330" y="540" font-size="11" fill="#8a93a0" font-family="ui-monospace, Menlo, monospace"># opt-in: served a temp file instead</text>
<text x="66" y="558" font-size="11" fill="#626b78" font-family="ui-monospace, Menlo, monospace">def decode(path: Path, rel_path: str) -&gt; str | None: ...</text>
<text x="66" y="584" font-size="11" fill="#626b78" font-family="ui-monospace, Menlo, monospace">META_FIELDS = {"doc_id": "ctx"}</text>
<text x="330" y="584" font-size="11" fill="#8a93a0" font-family="ui-monospace, Menlo, monospace"># optional: metadata key -&gt; index field</text>
<text x="66" y="614" font-size="11" fill="#8a93a0">The temp file has a FIXED prefix (fux-decode-), never the document's name.</text>
<text x="66" y="632" font-size="11" fill="#8a93a0">Caps (rows, depth, bytes) come from formats.toml [limits.&lt;name&gt;], never a constant (L12).</text>
<rect x="636" y="466" width="460" height="194" rx="10" fill="#ffffff" stroke="#c9cfd8" stroke-width="1.4"/>
<text x="656" y="492" font-size="13" fill="#14181f" font-weight="600">What the return value means</text>
<text x="656" y="516" font-size="11.5" fill="#4a5260" font-family="ui-monospace, Menlo, monospace">a string  -&gt;  the document's text (Markdown)</text>
<text x="656" y="536" font-size="11.5" fill="#4a5260" font-family="ui-monospace, Menlo, monospace">None      -&gt;  nothing readable; a model is needed</text>
<text x="656" y="556" font-size="11.5" fill="#4a5260" font-family="ui-monospace, Menlo, monospace">raises    -&gt;  DecodeFailed: skipped, never fatal</text>
<text x="656" y="586" font-size="11.5" fill="#c2410c">A missing third-party library is a LOUD error</text>
<text x="656" y="602" font-size="11.5" fill="#626b78">naming the module. Quietly queueing the file</text>
<text x="656" y="618" font-size="11.5" fill="#626b78">would let two machines commit different</text>
<text x="656" y="634" font-size="11.5" fill="#626b78">indexes from the same sources (L4).</text>

<text x="46" y="702" font-size="11" fill="#9aa3af" font-weight="600" letter-spacing="1.1">3 - WHERE A DECODER SITS IN INGEST</text>
<line x1="46" y1="712" x2="1096" y2="712" stroke="#e4e4e0" stroke-width="1"/>
<rect x="46" y="722" width="150" height="150" rx="10" fill="#ffffff" stroke="#c9cfd8" stroke-width="1.4"/>
<text x="62" y="748" font-size="12.5" fill="#14181f" font-weight="600" font-family="ui-monospace, Menlo, monospace">walk</text>
<text x="62" y="770" font-size="10.5" fill="#4a5260">sources/dirs</text>
<text x="62" y="787" font-size="10.5" fill="#4a5260">+ .fuxignore</text>
<text x="62" y="804" font-size="10.5" fill="#4a5260">+ formats.toml</text>
<text x="62" y="821" font-size="10.5" fill="#4a5260">  include</text>
<rect x="226" y="722" width="150" height="150" rx="10" fill="#ffffff" stroke="#c9cfd8" stroke-width="1.4"/>
<text x="242" y="748" font-size="12.5" fill="#14181f" font-weight="600" font-family="ui-monospace, Menlo, monospace">claims()</text>
<text x="242" y="770" font-size="10.5" fill="#4a5260">a .docx is binary</text>
<text x="242" y="787" font-size="10.5" fill="#4a5260">and still a</text>
<text x="242" y="804" font-size="10.5" fill="#4a5260">document: asked</text>
<text x="242" y="821" font-size="10.5" fill="#4a5260">BEFORE the byte</text>
<text x="242" y="838" font-size="10.5" fill="#4a5260">tests</text>
<rect x="406" y="722" width="150" height="150" rx="10" fill="#eef3fd" stroke="#3d6df2" stroke-width="1.8"/>
<text x="422" y="748" font-size="12.5" fill="#14181f" font-weight="600" font-family="ui-monospace, Menlo, monospace">decode</text>
<text x="422" y="770" font-size="10.5" fill="#4a5260">bytes -&gt; Markdown</text>
<text x="422" y="787" font-size="10.5" fill="#4a5260">NFC normalised</text>
<text x="422" y="804" font-size="10.5" fill="#4a5260">frontmatter NOT</text>
<text x="422" y="821" font-size="10.5" fill="#4a5260">re-parsed. A url:</text>
<text x="422" y="838" font-size="10.5" fill="#4a5260">doc arrives with</text>
<text x="422" y="855" font-size="10.5" fill="#4a5260">decoder= chosen</text>
<rect x="586" y="722" width="150" height="150" rx="10" fill="#eaf7f0" stroke="#1d8a5e" stroke-width="1.8"/>
<text x="602" y="748" font-size="12.5" fill="#14181f" font-weight="600" font-family="ui-monospace, Menlo, monospace">content_sha</text>
<text x="602" y="770" font-size="10.5" fill="#4a5260">ON THE RAW</text>
<text x="602" y="787" font-size="10.5" fill="#4a5260">BYTES -- before</text>
<text x="602" y="804" font-size="10.5" fill="#4a5260">redaction. This</text>
<text x="602" y="821" font-size="10.5" fill="#4a5260">is load-bearing:</text>
<text x="602" y="838" font-size="10.5" fill="#4a5260">refer compares</text>
<text x="602" y="855" font-size="10.5" fill="#4a5260">against it.</text>
<rect x="766" y="722" width="150" height="150" rx="10" fill="#eaf7f0" stroke="#1d8a5e" stroke-width="1.8"/>
<text x="782" y="748" font-size="12.5" fill="#14181f" font-weight="600" font-family="ui-monospace, Menlo, monospace">redact</text>
<text x="782" y="770" font-size="10.5" fill="#4a5260">body + frontmatter</text>
<text x="782" y="787" font-size="10.5" fill="#4a5260">title, per</text>
<text x="782" y="804" font-size="10.5" fill="#4a5260">pii.toml</text>
<text x="782" y="821" font-size="10.5" fill="#4a5260">(REQUIRED: every</text>
<text x="782" y="838" font-size="10.5" fill="#4a5260">command refuses</text>
<text x="782" y="855" font-size="10.5" fill="#4a5260">without it)</text>
<rect x="946" y="722" width="150" height="150" rx="10" fill="#ffffff" stroke="#c9cfd8" stroke-width="1.4"/>
<text x="962" y="748" font-size="12.5" fill="#14181f" font-weight="600" font-family="ui-monospace, Menlo, monospace">extract</text>
<text x="962" y="770" font-size="10.5" fill="#4a5260">title, phrases,</text>
<text x="962" y="787" font-size="10.5" fill="#4a5260">tf over 5 fields:</text>
<text x="962" y="804" font-size="10.5" fill="#4a5260">body heading</text>
<text x="962" y="821" font-size="10.5" fill="#4a5260">title path ctx;</text>
<text x="962" y="838" font-size="10.5" fill="#4a5260">edges</text>
<path d="M196,797 L224,797" fill="none" stroke="#3d6df2" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M376,797 L404,797" fill="none" stroke="#3d6df2" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M556,797 L584,797" fill="none" stroke="#3d6df2" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M736,797 L764,797" fill="none" stroke="#3d6df2" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M916,797 L944,797" fill="none" stroke="#3d6df2" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="46" y="888" width="1050" height="92" rx="8" fill="#fff4ec" stroke="#c2410c" stroke-width="1.8" stroke-dasharray="5 4"/>
<text x="66" y="912" font-size="12" fill="#c2410c" font-weight="600">decode() returned None  -&gt;  the document is QUEUED, not dropped.</text>
<text x="66" y="931" font-size="11" fill="#4a5260">A row lands in .fux/enrich/queue.tsv (committed, sorted, no clock) with one of two reasons, spelled once in constants.toml [decoders]:</text>
<text x="66" y="948" font-size="11" fill="#4a5260">"no decoder for .png" (someone could write one) vs "image: nothing readable in .png" (only a model will help).</text>
<text x="66" y="965" font-size="11" fill="#4a5260">fux enrich reads the queue (W-248): declared scope plus the "nothing readable" rows. An unreadable url: doc joins it; an unfetched one never does.</text>

<text x="46" y="1020" font-size="11" fill="#9aa3af" font-weight="600" letter-spacing="1.1">THE ASYMMETRY THAT MATTERS</text>
<line x1="46" y1="1030" x2="1096" y2="1030" stroke="#e4e4e0" stroke-width="1"/>
<text x="46" y="1054" font-size="13" fill="#14181f" font-weight="600">The index is redacted. Nothing else is.</text>
<text x="46" y="1074" font-size="11.5" fill="#4a5260">PII rules strip the committed index. The acquired bytes, the refer plane and every fux answer quote see the document as it is.</text>
<text x="46" y="1092" font-size="11.5" fill="#4a5260">So fux answer can quote a value that fux ask cannot find. That is the policy, not a bug -- redaction protects what gets COMMITTED.</text>
<text x="46" y="1114" font-size="11" fill="#8a93a0">A document's own path cannot be redacted -- loc is an address -- so matches there are counted and named on stderr instead.</text>

<text x="46" y="1150" font-size="11" fill="#9aa3af" font-weight="600" letter-spacing="1.1">DECODERS ARE PYTHON'S, AND ONLY PYTHON'S</text>
<line x1="46" y1="1160" x2="1096" y2="1160" stroke="#e4e4e0" stroke-width="1"/>
<text x="46" y="1182" font-size="11.5" fill="#4a5260">The Node reader has no decoder plane and is not getting one: decoding happens at ingest, and ingest is Python only. Node reads the index a Python ingest wrote.</text>
<text x="46" y="1200" font-size="11" fill="#8a93a0">node/src/decode/registry.mjs asks the question the other way round -- is this document ALREADY TEXT? -- from formats.toml's committed include list, never a mirrored registry.</text>
<text x="46" y="1216" font-size="11" fill="#8a93a0">Where fux answer would have to decode a document to quote it, Node skips it: verdict unverified, "node has no decoder for this type" (SR-NODE-SEARCH decision 11).</text>
<line x1="46" y1="1228" x2="1096" y2="1228" stroke="#e4e4e0" stroke-width="1"/>
<text x="46" y="1242" font-size="10.5" fill="#8a93a0">Drawn from the code, 2026-10-05. src/fux/decode/__init__.py, _limits.py, src/fux/ingest/run.py, parse.py, gitdir.py, queue.py, src/fux/constants.toml, node/src/decode/registry.mjs.</text>
<text x="46" y="1256" font-size="10.5" fill="#8a93a0">SR-DECODE (0139) - SR-TYPES (0128) - SR-PII (0148) - SR-NODE-SEARCH (0153). The URL half of the pipe: architecture-fetchers.svg.</text>
</svg>
