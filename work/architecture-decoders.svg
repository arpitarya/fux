<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 1010" width="1140" height="1010" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10" fill="none" stroke="#3d6df2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10" fill="none" stroke="#1d8a5e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10" fill="none" stroke="#8a93a0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10" fill="none" stroke="#c2410c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="1140" height="1010" fill="#fcfcfb"/>
<text x="46" y="52" font-size="23" font-weight="600" fill="#14181f">How decoders work</text>
<text x="46" y="76" font-size="13" fill="#626b78">A decoder turns bytes fux cannot read into Markdown it can. Consumer-owned, one module per format.</text>
<rect x="760" y="34" width="340" height="54" rx="8" fill="#fcfcfb" stroke="#e4e4e0" stroke-width="1.2"/>
<rect x="772" y="46" width="11" height="11" rx="2.5" fill="#eef3fd" stroke="#3d6df2" stroke-width="1.4"/>
<text x="790" y="55" font-size="10.5" fill="#626b78">committed to your repo</text>
<rect x="772" y="60" width="11" height="11" rx="2.5" fill="#ffffff" stroke="#c9cfd8" stroke-width="1.4"/>
<text x="790" y="69" font-size="10.5" fill="#626b78">engine-side</text>
<rect x="772" y="74" width="11" height="11" rx="2.5" fill="#fff4ec" stroke="#c2410c" stroke-width="1.4"/>
<text x="790" y="83" font-size="10.5" fill="#626b78">refusal / queued</text>
<text x="46" y="126" font-size="11" fill="#9aa3af" font-weight="600" letter-spacing="1.1">1 - WHICH DECODER READS THIS EXTENSION</text>
<line x1="46" y1="136" x2="1096" y2="136" stroke="#e4e4e0" stroke-width="1"/>
<rect x="46" y="146" width="330" height="168" rx="10" fill="#ffffff" stroke="#c9cfd8" stroke-width="1.4"/>
<text x="66" y="172" font-size="13" fill="#14181f" font-weight="600">Built-in</text>
<text x="66" y="192" font-size="11.5" fill="#4a5260">17 modules in fux.decode, listed</text>
<text x="66" y="208" font-size="11.5" fill="#4a5260">explicitly -- never a directory scan,</text>
<text x="66" y="224" font-size="11.5" fill="#4a5260">because filesystem order would make</text>
<text x="66" y="240" font-size="11.5" fill="#4a5260">the index depend on it (L3).</text>
<text x="66" y="264" font-size="10.5" fill="#626b78" font-family="ui-monospace, Menlo, monospace">csv docx drawio html image ini json</text>
<text x="66" y="280" font-size="10.5" fill="#626b78" font-family="ui-monospace, Menlo, monospace">jsonl mail pdf pptx rtf svg toml xlsx</text>
<text x="66" y="296" font-size="10.5" fill="#626b78" font-family="ui-monospace, Menlo, monospace">xml yaml</text>
<rect x="406" y="146" width="330" height="168" rx="10" fill="#eef3fd" stroke="#3d6df2" stroke-width="1.8"/>
<text x="426" y="172" font-size="13" fill="#14181f" font-weight="600">.fux/decoders/*.py</text>
<text x="426" y="192" font-size="11.5" fill="#4a5260" font-weight="600">THESE COPIES ARE WHAT RUN.</text>
<text x="426" y="210" font-size="11.5" fill="#4a5260">fux setup copies the built-ins here;</text>
<text x="426" y="226" font-size="11.5" fill="#4a5260">a module of the same name replaces</text>
<text x="426" y="242" font-size="11.5" fill="#4a5260">the built-in wholesale.</text>
<text x="426" y="266" font-size="11.5" fill="#626b78">Matched by MODULE NAME, not by</text>
<text x="426" y="282" font-size="11.5" fill="#626b78">extension -- two files both claiming</text>
<text x="426" y="298" font-size="11.5" fill="#626b78">.html would otherwise race.</text>
<rect x="766" y="146" width="330" height="168" rx="10" fill="#eef3fd" stroke="#3d6df2" stroke-width="1.8"/>
<text x="786" y="172" font-size="13" fill="#14181f" font-weight="600">formats.toml [decoders]</text>
<text x="786" y="192" font-size="11.5" fill="#4a5260" font-family="ui-monospace, Menlo, monospace">geojson = "json"</text>
<text x="786" y="212" font-size="11.5" fill="#4a5260" font-weight="600">Wins over both -- and is CHECKED.</text>
<text x="786" y="236" font-size="11.5" fill="#4a5260">Extending is allowed: claim an</text>
<text x="786" y="252" font-size="11.5" fill="#4a5260">extension nobody claims.</text>
<text x="786" y="272" font-size="11.5" fill="#c2410c">Redirecting is REFUSED: csv = "json"</text>
<text x="786" y="288" font-size="11.5" fill="#626b78">raises, naming both modules. A typo</text>
<text x="786" y="304" font-size="11.5" fill="#626b78">indexes nothing; a redirect lies.</text>
<path d="M380,230 L402,230" fill="none" stroke="#3d6df2" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M740,230 L762,230" fill="none" stroke="#3d6df2" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="360" y="207" width="62" height="17" rx="5" fill="#fcfcfb" stroke="none"/>
<text x="391" y="219" font-size="10.5" fill="#626b78" text-anchor="middle">replaces</text>
<rect x="729" y="207" width="44" height="17" rx="5" fill="#fcfcfb" stroke="none"/>
<text x="751" y="219" font-size="10.5" fill="#626b78" text-anchor="middle">binds</text>
<text x="46" y="356" font-size="11" fill="#9aa3af" font-weight="600" letter-spacing="1.1">2 - THE PROTOCOL A DECODER IMPLEMENTS</text>
<line x1="46" y1="366" x2="1096" y2="366" stroke="#e4e4e0" stroke-width="1"/>
<rect x="46" y="376" width="520" height="150" rx="10" fill="#ffffff" stroke="#c9cfd8" stroke-width="1.4"/>
<text x="66" y="402" font-size="12" fill="#14181f" font-family="ui-monospace, Menlo, monospace">EXTENSIONS = (".html", ".htm")</text>
<text x="66" y="424" font-size="12" fill="#14181f" font-family="ui-monospace, Menlo, monospace">def decode(raw: bytes, rel_path: str) -&gt; str | None: ...</text>
<text x="66" y="454" font-size="11" fill="#626b78" font-family="ui-monospace, Menlo, monospace">WANTS_PATH = True            # opt-in variant</text>
<text x="66" y="474" font-size="11" fill="#626b78" font-family="ui-monospace, Menlo, monospace">def decode(path: Path, rel_path: str) -&gt; str | None: ...</text>
<text x="66" y="504" font-size="11" fill="#8a93a0">A path-wanting decoder is served from a temp file with a FIXED prefix.</text>
<rect x="596" y="376" width="500" height="150" rx="10" fill="#ffffff" stroke="#c9cfd8" stroke-width="1.4"/>
<text x="616" y="402" font-size="13" fill="#14181f" font-weight="600">What the return value means</text>
<text x="616" y="424" font-size="11.5" fill="#4a5260" font-family="ui-monospace, Menlo, monospace">a string  -&gt;  this is the document's text</text>
<text x="616" y="444" font-size="11.5" fill="#4a5260" font-family="ui-monospace, Menlo, monospace">None      -&gt;  nothing readable here</text>
<text x="616" y="470" font-size="11.5" fill="#c2410c">A missing third-party library is a LOUD error naming the</text>
<text x="616" y="486" font-size="11.5" fill="#626b78">module. Quietly queueing the file would let two machines</text>
<text x="616" y="502" font-size="11.5" fill="#626b78">commit different indexes from the same sources (L3).</text>
<text x="46" y="568" font-size="11" fill="#9aa3af" font-weight="600" letter-spacing="1.1">3 - WHERE A DECODER SITS IN INGEST</text>
<line x1="46" y1="578" x2="1096" y2="578" stroke="#e4e4e0" stroke-width="1"/>
<rect x="46" y="588" width="150" height="146" rx="10" fill="#ffffff" stroke="#c9cfd8" stroke-width="1.4"/>
<text x="62" y="614" font-size="12.5" fill="#14181f" font-weight="600" font-family="ui-monospace, Menlo, monospace">walk</text>
<text x="62" y="636" font-size="10.5" fill="#4a5260">sources/dirs</text>
<text x="62" y="653" font-size="10.5" fill="#4a5260">+ .fuxignore</text>
<text x="62" y="670" font-size="10.5" fill="#4a5260">+ formats.toml</text>
<rect x="226" y="588" width="150" height="146" rx="10" fill="#ffffff" stroke="#c9cfd8" stroke-width="1.4"/>
<text x="242" y="614" font-size="12.5" fill="#14181f" font-weight="600" font-family="ui-monospace, Menlo, monospace">claims()</text>
<text x="242" y="636" font-size="10.5" fill="#4a5260">a .docx is binary</text>
<text x="242" y="653" font-size="10.5" fill="#4a5260">and still a</text>
<text x="242" y="670" font-size="10.5" fill="#4a5260">document</text>
<rect x="406" y="588" width="150" height="146" rx="10" fill="#eef3fd" stroke="#3d6df2" stroke-width="1.8"/>
<text x="422" y="614" font-size="12.5" fill="#14181f" font-weight="600" font-family="ui-monospace, Menlo, monospace">decode</text>
<text x="422" y="636" font-size="10.5" fill="#4a5260">bytes -&gt; Markdown</text>
<text x="422" y="653" font-size="10.5" fill="#4a5260">NFC normalised</text>
<text x="422" y="670" font-size="10.5" fill="#4a5260">frontmatter NOT</text>
<text x="422" y="687" font-size="10.5" fill="#4a5260">re-parsed</text>
<rect x="586" y="588" width="150" height="146" rx="10" fill="#eaf7f0" stroke="#1d8a5e" stroke-width="1.8"/>
<text x="602" y="614" font-size="12.5" fill="#14181f" font-weight="600" font-family="ui-monospace, Menlo, monospace">content_sha</text>
<text x="602" y="636" font-size="10.5" fill="#4a5260">ON THE RAW</text>
<text x="602" y="653" font-size="10.5" fill="#4a5260">BYTES -- before</text>
<text x="602" y="670" font-size="10.5" fill="#4a5260">redaction. This</text>
<text x="602" y="687" font-size="10.5" fill="#4a5260">is load-bearing.</text>
<rect x="766" y="588" width="150" height="146" rx="10" fill="#eaf7f0" stroke="#1d8a5e" stroke-width="1.8"/>
<text x="782" y="614" font-size="12.5" fill="#14181f" font-weight="600" font-family="ui-monospace, Menlo, monospace">redact</text>
<text x="782" y="636" font-size="10.5" fill="#4a5260">body + frontmatter</text>
<text x="782" y="653" font-size="10.5" fill="#4a5260">title, per</text>
<text x="782" y="670" font-size="10.5" fill="#4a5260">pii.toml</text>
<text x="782" y="687" font-size="10.5" fill="#4a5260">(REQUIRED)</text>
<rect x="946" y="588" width="150" height="146" rx="10" fill="#ffffff" stroke="#c9cfd8" stroke-width="1.4"/>
<text x="962" y="614" font-size="12.5" fill="#14181f" font-weight="600" font-family="ui-monospace, Menlo, monospace">extract</text>
<text x="962" y="636" font-size="10.5" fill="#4a5260">title, phrases,</text>
<text x="962" y="653" font-size="10.5" fill="#4a5260">terms/flen over</text>
<text x="962" y="670" font-size="10.5" fill="#4a5260">5 fields, edges</text>
<path d="M196,660 L224,660" fill="none" stroke="#3d6df2" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M376,660 L404,660" fill="none" stroke="#3d6df2" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M556,660 L584,660" fill="none" stroke="#3d6df2" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M736,660 L764,660" fill="none" stroke="#3d6df2" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M916,660 L944,660" fill="none" stroke="#3d6df2" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="46" y="750" width="1050" height="54" rx="8" fill="#fff4ec" stroke="#c2410c" stroke-width="1.8" stroke-dasharray="5 3"/>
<text x="66" y="774" font-size="12" fill="#c2410c" font-weight="600">decode() returned None  -&gt;  the document is QUEUED, not dropped.</text>
<text x="66" y="792" font-size="11" fill="#4a5260">A row lands in .fux/enrich/queue.tsv with the reason. "No decoder for .png" (someone could write one) is a different fact from "image: nothing readable in .png" (only a model will help).</text>
<text x="46" y="846" font-size="11" fill="#9aa3af" font-weight="600" letter-spacing="1.1">THE ASYMMETRY THAT MATTERS</text>
<line x1="46" y1="856" x2="1096" y2="856" stroke="#e4e4e0" stroke-width="1"/>
<text x="46" y="880" font-size="13" fill="#14181f" font-weight="600">The index is redacted. Nothing else is.</text>
<text x="46" y="900" font-size="11.5" fill="#4a5260">PII rules strip the committed index. The acquired bytes, the refer plane and every fux answer quote see the document as it is.</text>
<text x="46" y="918" font-size="11.5" fill="#4a5260">So fux answer can quote a value that fux ask cannot find. That is the policy, not a bug -- redaction protects what gets COMMITTED.</text>
<text x="46" y="942" font-size="11.5" fill="#8a93a0">A document's own path cannot be redacted -- loc is an address -- so matches there are counted and named on stderr instead.</text>
<line x1="46" y1="968" x2="1096" y2="968" stroke="#e4e4e0" stroke-width="1"/>
<text x="46" y="982" font-size="10.5" fill="#8a93a0">Drawn from src/fux/decode/__init__.py and src/fux/ingest/run.py, 2026-09-12. ADR-DECODE - ADR-TYPES - ADR-PII.</text>
</svg>
