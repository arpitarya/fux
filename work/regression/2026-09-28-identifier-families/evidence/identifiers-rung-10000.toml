# .fux/identifiers.toml -- identifier families (SR-IDENTIFIERS).
#
# A family keeps an identifier whole however it is typed. With the template
# RF-{n}, the text "RF 118", "rf118", "RF–118" and "RF-0118" each add the one
# term rf-118 -- in a document at ingest and in a question at query time -- so
# the document that names RF-118 outranks one that merely says RF-119 and 118.
#
# Template grammar: letters and digits are literal (any case). `-` and `_`
# accept -, _, a Unicode dash, one space, or nothing between a letter and a
# digit. `.` `/` `:` match themselves. {n} is digits (leading zeros ignored);
# {X} is letters. A template must START WITH A LETTER, so prose like "step 4"
# can never match one.
#
# ⚠ CHANGES THE INDEX: after editing, run `fux ingest`. `fux doctor` says when
# the index was built under different families. Both tables may stay empty;
# an empty file changes nothing at all.

[user]
# Yours. fux never writes this table, and it wins over [detected].
keep = []   # templates to keep whole, e.g. ["RF-{n}", "ADR-{n}"]
drop = []   # detected templates to ignore
# EXPERTS ONLY -- prefer a template. A regex is checked when it is loaded and
# refused if it uses lookaround, a quantified group, an anchor, an unescaped
# `.` or \s: each behaves differently in the Python and Node readers, or can
# backtrack without end. `fux serve`'s Identifiers tab tests one first.
regex = []

[detected]
# Written by `fux identifiers --write` from the families `fux inspect` finds.
