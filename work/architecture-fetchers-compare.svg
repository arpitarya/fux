<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 922" width="1140" height="922" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10" fill="none" stroke="#3d6df2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10" fill="none" stroke="#1d8a5e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10" fill="none" stroke="#8a93a0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10" fill="none" stroke="#c2410c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="1140" height="922" fill="#fcfcfb"/>
<text x="46" y="52" font-size="23" font-weight="600" fill="#14181f">Fetchers: the model in mind vs the one built</text>
<text x="46" y="76" font-size="13" fill="#626b78">Arpit's description (2026-09-21) on the left, the shipped design on the right.</text>
<text x="46" y="94" font-size="13" fill="#626b78">Same consumer freedom; different key, different pairing, no crawl.</text>
<rect x="760" y="34" width="340" height="40" rx="8" fill="#ffffff" stroke="#c9cfd8" stroke-width="1.4"/>
<rect x="772" y="44" width="10" height="10" rx="2.5" fill="#eef3fd" stroke="#3d6df2" stroke-width="1.4"/>
<text x="790" y="53" font-size="11" fill="#626b78">consumer-owned, committed</text>
<rect x="772" y="58" width="10" height="10" rx="2.5" fill="#fff4ec" stroke="#c2410c" stroke-width="1.4"/>
<text x="790" y="67" font-size="11" fill="#626b78">not built, by law</text>

<text x="46" y="136" font-size="11" fill="#9aa3af" font-weight="600" letter-spacing="1.1">THE MODEL IN MIND -- one fetcher per document KIND, each handing to its decoder, links followed</text>
<line x1="46" y1="146" x2="1096" y2="146" stroke="#e4e4e0" stroke-width="1"/>
<path d="M571,172 L571,160 L121,160 L121,170" fill="none" stroke="#c2410c" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#o)"/>
<rect x="236" y="152" width="222" height="16" rx="5" fill="#fcfcfb" stroke="none"/>
<text x="347" y="164" font-size="10.5" fill="#c2410c" text-anchor="middle">... and every link goes back to a fetcher</text>
<rect x="46" y="172" width="150" height="60" rx="8" fill="#eef3fd" stroke="#3d6df2" stroke-width="1.6"/>
<text x="121" y="198" font-size="11.5" fill="#14181f" text-anchor="middle" font-weight="600">XLSX fetcher</text>
<text x="121" y="216" font-size="10.5" fill="#4a5260" text-anchor="middle">downloads the workbook</text>
<path d="M196,202 L224,202" fill="none" stroke="#3d6df2" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="226" y="172" width="150" height="60" rx="8" fill="#eef3fd" stroke="#3d6df2" stroke-width="1.6"/>
<text x="301" y="198" font-size="11.5" fill="#14181f" text-anchor="middle" font-weight="600">xlsx decoder</text>
<text x="301" y="216" font-size="10.5" fill="#4a5260" text-anchor="middle">-&gt; index</text>
<rect x="46" y="248" width="150" height="60" rx="8" fill="#eef3fd" stroke="#3d6df2" stroke-width="1.6"/>
<text x="121" y="274" font-size="11.5" fill="#14181f" text-anchor="middle" font-weight="600">HTML fetcher</text>
<text x="121" y="292" font-size="10.5" fill="#4a5260" text-anchor="middle">fetches the page</text>
<path d="M196,278 L224,278" fill="none" stroke="#3d6df2" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="226" y="248" width="150" height="60" rx="8" fill="#eef3fd" stroke="#3d6df2" stroke-width="1.6"/>
<text x="301" y="274" font-size="11.5" fill="#14181f" text-anchor="middle" font-weight="600">html decoder</text>
<text x="301" y="292" font-size="10.5" fill="#4a5260" text-anchor="middle">-&gt; index, and finds links</text>
<rect x="46" y="324" width="150" height="60" rx="8" fill="#eef3fd" stroke="#3d6df2" stroke-width="1.6"/>
<text x="121" y="350" font-size="11.5" fill="#14181f" text-anchor="middle" font-weight="600">image fetcher</text>
<text x="121" y="368" font-size="10.5" fill="#4a5260" text-anchor="middle">http / cdp if needed</text>
<path d="M196,354 L224,354" fill="none" stroke="#3d6df2" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="226" y="324" width="150" height="60" rx="8" fill="#eef3fd" stroke="#3d6df2" stroke-width="1.6"/>
<text x="301" y="350" font-size="11.5" fill="#14181f" text-anchor="middle" font-weight="600">image decoder</text>
<text x="301" y="368" font-size="10.5" fill="#4a5260" text-anchor="middle">-&gt; index</text>
<path d="M376,278 L404,278" fill="none" stroke="#c2410c" stroke-width="1.6" marker-end="url(#o)"/>
<rect x="406" y="172" width="330" height="212" rx="10" fill="#fff4ec" stroke="#c2410c" stroke-width="1.6" stroke-dasharray="5 4"/>
<text x="426" y="198" font-size="13" fill="#c2410c" font-weight="600">the crawl</text>
<text x="426" y="220" font-size="11.5" fill="#4a5260">every link the html decoder finds goes back</text>
<text x="426" y="236" font-size="11.5" fill="#4a5260">to a fetcher, by kind:</text>
<text x="426" y="260" font-size="11" fill="#4a5260" font-family="ui-monospace, Menlo, monospace">a.html  -&gt; HTML fetcher  -&gt; html decoder</text>
<text x="426" y="278" font-size="11" fill="#4a5260" font-family="ui-monospace, Menlo, monospace">b.xlsx  -&gt; XLSX fetcher  -&gt; xlsx decoder</text>
<text x="426" y="296" font-size="11" fill="#4a5260" font-family="ui-monospace, Menlo, monospace">c.png   -&gt; image fetcher -&gt; image decoder</text>
<text x="426" y="314" font-size="11" fill="#4a5260" font-family="ui-monospace, Menlo, monospace">... and each html page recurses</text>
<text x="426" y="342" font-size="11" fill="#c2410c">Frontier is unbounded and order-dependent; the</text>
<text x="426" y="358" font-size="11" fill="#c2410c">corpus becomes whatever the web linked to today.</text>
<rect x="766" y="172" width="330" height="212" rx="10" fill="#ffffff" stroke="#c9cfd8" stroke-width="1.4"/>
<text x="786" y="198" font-size="13" fill="#14181f" font-weight="600">What this gets right</text>
<text x="786" y="222" font-size="11.5" fill="#4a5260">- consumers write their own fetchers</text>
<text x="786" y="240" font-size="11.5" fill="#4a5260">- http and cdp are just the two shipped ones</text>
<text x="786" y="258" font-size="11.5" fill="#4a5260">- every fetched thing goes through a decoder</text>
<text x="786" y="276" font-size="11.5" fill="#4a5260">- xlsx, html, images each have their decoder</text>
<text x="786" y="304" font-size="13" fill="#14181f" font-weight="600">What it assumes</text>
<text x="786" y="328" font-size="11.5" fill="#4a5260">- a fetcher knows the format before it fetches</text>
<text x="786" y="346" font-size="11.5" fill="#4a5260">- the fetcher decides the decoder</text>
<text x="786" y="364" font-size="11.5" fill="#4a5260">- discovery happens during ingest</text>

<text x="46" y="430" font-size="11" fill="#9aa3af" font-weight="600" letter-spacing="1.1">THE ONE BUILT -- one fetcher per transport / host, the LINE pairs it with a decoder, links are edges</text>
<line x1="46" y1="440" x2="1096" y2="440" stroke="#e4e4e0" stroke-width="1"/>
<rect x="46" y="454" width="150" height="60" rx="8" fill="#eef3fd" stroke="#3d6df2" stroke-width="1.6"/>
<text x="121" y="480" font-size="11.5" fill="#14181f" text-anchor="middle" font-weight="600" font-family="ui-monospace, Menlo, monospace">cdp.py</text>
<text x="121" y="498" font-size="10.5" fill="#4a5260" text-anchor="middle">*.sharepoint.com</text>
<rect x="46" y="530" width="150" height="60" rx="8" fill="#eef3fd" stroke="#3d6df2" stroke-width="1.6"/>
<text x="121" y="556" font-size="11.5" fill="#14181f" text-anchor="middle" font-weight="600" font-family="ui-monospace, Menlo, monospace">http.py</text>
<text x="121" y="574" font-size="10.5" fill="#4a5260" text-anchor="middle">the public web</text>
<rect x="46" y="606" width="150" height="60" rx="8" fill="#eef3fd" stroke="#3d6df2" stroke-width="1.6"/>
<text x="121" y="632" font-size="11.5" fill="#14181f" text-anchor="middle" font-weight="600" font-family="ui-monospace, Menlo, monospace">own.py</text>
<text x="121" y="650" font-size="10.5" fill="#4a5260" text-anchor="middle">ROUTES: *.atlassian.net</text>
<path d="M196,484 L224,484" fill="none" stroke="#3d6df2" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M196,560 L224,560" fill="none" stroke="#3d6df2" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M196,636 L224,636" fill="none" stroke="#3d6df2" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="226" y="454" width="330" height="228" rx="10" fill="#eef3fd" stroke="#3d6df2" stroke-width="1.8"/>
<text x="246" y="480" font-size="13" fill="#14181f" font-weight="600">.fux/sources/urls -- the LINE pairs them</text>
<text x="246" y="506" font-size="10.5" fill="#4a5260" font-family="ui-monospace, Menlo, monospace">.../hr/p.xlsx   fetch=cdp  decoder=xlsx</text>
<text x="246" y="524" font-size="10.5" fill="#4a5260" font-family="ui-monospace, Menlo, monospace">.../wiki/a.html fetch=cdp  decoder=html</text>
<text x="246" y="542" font-size="10.5" fill="#4a5260" font-family="ui-monospace, Menlo, monospace">.../logo.png    fetch=http decoder=image</text>
<text x="246" y="560" font-size="10.5" fill="#4a5260" font-family="ui-monospace, Menlo, monospace">.../ADR-8       fetch=own  decoder=prose</text>
<text x="246" y="588" font-size="11.5" fill="#4a5260">One cdp fetcher, three formats. The format</text>
<text x="246" y="604" font-size="11.5" fill="#4a5260">is a fact about the document; the transport</text>
<text x="246" y="620" font-size="11.5" fill="#4a5260">is a fact about the host. Both are written</text>
<text x="246" y="636" font-size="11.5" fill="#4a5260">once, at fux add, and re-used at answer time.</text>
<text x="246" y="656" font-size="10.5" fill="#626b78">fux add writes decoder= once (the observed type,</text>
<text x="246" y="670" font-size="10.5" fill="#626b78">or --decoder); ingest reads only the line (DoD 10).</text>
<path d="M556,560 L584,560" fill="none" stroke="#3d6df2" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="586" y="454" width="150" height="60" rx="8" fill="#eef3fd" stroke="#3d6df2" stroke-width="1.6"/>
<text x="661" y="480" font-size="11.5" fill="#14181f" text-anchor="middle" font-weight="600" font-family="ui-monospace, Menlo, monospace">xlsx.py</text>
<text x="661" y="498" font-size="10.5" fill="#4a5260" text-anchor="middle">-&gt; Markdown</text>
<rect x="586" y="530" width="150" height="60" rx="8" fill="#eef3fd" stroke="#3d6df2" stroke-width="1.6"/>
<text x="661" y="556" font-size="11.5" fill="#14181f" text-anchor="middle" font-weight="600" font-family="ui-monospace, Menlo, monospace">html.py</text>
<text x="661" y="574" font-size="10.5" fill="#4a5260" text-anchor="middle">-&gt; Markdown with [text](href)</text>
<rect x="586" y="606" width="150" height="60" rx="8" fill="#eef3fd" stroke="#3d6df2" stroke-width="1.6"/>
<text x="661" y="632" font-size="11.5" fill="#14181f" text-anchor="middle" font-weight="600" font-family="ui-monospace, Menlo, monospace">image.py</text>
<text x="661" y="650" font-size="10.5" fill="#4a5260" text-anchor="middle">embedded text only</text>
<path d="M736,560 L764,560" fill="none" stroke="#3d6df2" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="766" y="454" width="330" height="228" rx="10" fill="#ffffff" stroke="#c9cfd8" stroke-width="1.4"/>
<text x="786" y="480" font-size="13" fill="#14181f" font-weight="600">What happens to a link in a.html</text>
<text x="786" y="504" font-size="11.5" fill="#4a5260">edges.py reads the Markdown:</text>
<text x="786" y="526" font-size="11" fill="#4a5260" font-family="ui-monospace, Menlo, monospace">-&gt; target already indexed: ref EDGE (graph)</text>
<text x="786" y="544" font-size="11" fill="#4a5260" font-family="ui-monospace, Menlo, monospace">-&gt; target not in the list: nothing</text>
<text x="786" y="572" font-size="11.5" fill="#4a5260">Nothing is fetched because a page said so.</text>
<text x="786" y="590" font-size="11.5" fill="#4a5260">The corpus is the committed list; ingest is</text>
<text x="786" y="606" font-size="11.5" fill="#4a5260">a pure function of it (L3, L4, L5).</text>
<text x="786" y="632" font-size="11" fill="#626b78">Want discovery? cdp.py ships extract_links()</text>
<text x="786" y="648" font-size="11" fill="#626b78">and nothing in fux calls it. A crawl, if you</text>
<text x="786" y="664" font-size="11" fill="#626b78">want one, is yours to write inside the fetcher.</text>

<text x="46" y="722" font-size="11" fill="#9aa3af" font-weight="600" letter-spacing="1.1">THE DIFFERENCES, IN ONE LINE EACH</text>
<line x1="46" y1="732" x2="1096" y2="732" stroke="#e4e4e0" stroke-width="1"/>
<text x="46" y="756" font-size="11.5" fill="#14181f" font-weight="600">1  key</text>
<text x="130" y="756" font-size="11.5" fill="#4a5260">in mind: per document kind (xlsx, html, image).  built: per transport / host. Kind x transport would be N x M fetchers; the line already carries both halves.</text>
<text x="46" y="780" font-size="11.5" fill="#14181f" font-weight="600">2  pairing</text>
<text x="130" y="780" font-size="11.5" fill="#4a5260">in mind: the fetcher picks its decoder.  built: the URL line declares decoder= once, at fux add; ingest and the refer plane read that line, never the header.</text>
<text x="46" y="804" font-size="11.5" fill="#14181f" font-weight="600">3  links</text>
<text x="130" y="804" font-size="11.5" fill="#4a5260">in mind: decoder finds links, fetchers follow them, recursively.  built: a link is a graph edge to a document already in the list, or nothing.</text>
<text x="46" y="828" font-size="11.5" fill="#14181f" font-weight="600">4  images</text>
<text x="130" y="828" font-size="11.5" fill="#4a5260">in mind: an image decoder indexes images.  built: image.py reads PNG tEXt, JPEG EXIF / COM and GIF comment text only -- no OCR, no vision model (L2, L4).</text>
<text x="46" y="852" font-size="11.5" fill="#14181f" font-weight="600">5  answer</text>
<text x="130" y="852" font-size="11.5" fill="#4a5260">not in mind: the SAME pinned fetcher and declared decoder run again at fux answer -- fresh sha; verdict current / stale / cached / as-ingested / unverified.</text>
<line x1="46" y1="878" x2="1096" y2="878" stroke="#e4e4e0" stroke-width="1"/>
<text x="46" y="894" font-size="10.5" fill="#8a93a0">Left: Arpit, Cowork, 2026-09-21. Right: drawn from the code, 2026-10-05 -- src/fux/ingest/urlsrc.py, routes.py, edges.py, src/fux/decode/image.py, html.py, src/fux/templates/cdp.py.txt.</text>
<text x="46" y="908" font-size="10.5" fill="#8a93a0">SR-FETCHER (0117) - SR-URL-LIST (0116) - SR-DECODE (0139). The mechanics: architecture-fetchers.svg and architecture-decoders.svg.</text>
</svg>
