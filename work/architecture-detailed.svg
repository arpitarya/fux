<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 920" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5" fill="none" stroke="#8a93a0" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5" fill="none" stroke="#3d6df2" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1240" height="920" fill="#fcfcfb"/>

  <text x="52" y="46" font-size="21" fill="#14181f" font-weight="600">Fux — the mechanism</text>
  <text x="52" y="70" font-size="11.5" fill="#626b78">2.0.0-alpha.0 · 2026-08-24 · fux.index.v2 / analyzer v2 / fux.runtime.v3</text>
  <rect x="946" y="32" width="13" height="13" rx="3" fill="#eef3fd" stroke="#3d6df2" stroke-width="1.6"/>
  <text x="966" y="43" font-size="11" fill="#626b78">committed to git</text>
  <rect x="1084" y="32" width="13" height="13" rx="3" fill="#f5f5f6" stroke="#9aa3af" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="1104" y="43" font-size="11" fill="#626b78">derived</text>

  <!-- ================= INGEST ================= -->
  <text x="52" y="106" font-size="10.5" fill="#9aa3af" font-weight="600" letter-spacing="1.2">INGEST — WALK, ANALYSE, DISCARD</text>

  <rect x="52" y="122" width="212" height="62" rx="9" fill="#fff" stroke="#c9cfd8" stroke-width="1.3"/>
  <text x="70" y="145" font-size="12.5" fill="#14181f" font-weight="600">.fux/sources/dirs · urls</text>
  <text x="70" y="166" font-size="11" fill="#626b78">one entry per line · loader-sorted</text>

  <rect x="52" y="196" width="212" height="62" rx="9" fill="#eef3fd" stroke="#3d6df2" stroke-width="1.3" stroke-dasharray="6 4"/>
  <text x="70" y="219" font-size="12.5" fill="#14181f" font-weight="600">.fux/enrich/&lt;sha&gt;.md</text>
  <text x="70" y="240" font-size="11" fill="#626b78">agent-written → the ctx field</text>

  <rect x="52" y="270" width="212" height="62" rx="9" fill="#fff" stroke="#c9cfd8" stroke-width="1.3"/>
  <text x="70" y="293" font-size="12.5" fill="#14181f" font-weight="600">priors</text>
  <text x="70" y="314" font-size="11" fill="#626b78">supersedes: · git commit recency</text>

  <rect x="300" y="122" width="196" height="210" rx="9" fill="#fff" stroke="#c9cfd8" stroke-width="1.4"/>
  <text x="318" y="147" font-size="13" fill="#14181f" font-weight="600">analyzer v2</text>
  <text x="318" y="172" font-size="11.5" fill="#626b78">split identifiers</text>
  <text x="318" y="192" font-size="11.5" fill="#626b78">lowercase</text>
  <text x="318" y="212" font-size="11.5" fill="#626b78">drop stopwords</text>
  <text x="318" y="232" font-size="11.5" fill="#626b78">Porter stem</text>
  <text x="318" y="252" font-size="11.5" fill="#626b78">blake2b → 16-hex</text>
  <text x="318" y="284" font-size="10.5" fill="#3d6df2">order is load-bearing:</text>
  <text x="318" y="300" font-size="10.5" fill="#3d6df2">split before lowercase,</text>
  <text x="318" y="316" font-size="10.5" fill="#3d6df2">stem before hash</text>

  <line x1="264" y1="153" x2="294" y2="180" stroke="#8a93a0" stroke-width="1.4" marker-end="url(#g)"/>
  <line x1="264" y1="227" x2="294" y2="227" stroke="#3d6df2" stroke-width="1.4" marker-end="url(#b)"/>
  <line x1="264" y1="301" x2="294" y2="274" stroke="#8a93a0" stroke-width="1.4" marker-end="url(#g)"/>
  <line x1="496" y1="227" x2="528" y2="227" stroke="#3d6df2" stroke-width="1.9" marker-end="url(#b)"/>

  <!-- ================= COMMITTED ================= -->
  <rect x="534" y="112" width="654" height="230" rx="11" fill="#eef3fd" stroke="#3d6df2" stroke-width="2"/>
  <text x="556" y="140" font-size="14" fill="#3d6df2" font-weight="600">THE COMMITTED PLANE · .fux/index/{00..ff}.jsonl</text>
  <text x="556" y="160" font-size="10.5" fill="#8a93a0">256 shards, doc-major, one canonical JSON line per document · header pins schema + analyzer</text>

  <rect x="556" y="176" width="304" height="146" rx="7" fill="#fff" stroke="#c3d2f7"/>
  <text x="570" y="197" font-size="11" fill="#4a5260" font-weight="600">identity</text>
  <text x="570" y="215" font-size="10.5" fill="#626b78">id · src · loc · sha · ver · mode · meta</text>
  <text x="570" y="240" font-size="11" fill="#4a5260" font-weight="600">retrieval</text>
  <text x="570" y="258" font-size="10.5" fill="#626b78">terms{hash: [tf×5]} · flen[5] · title · phrases</text>
  <text x="570" y="276" font-size="10.5" fill="#626b78">vectors[] — int8, one per chunk</text>
  <text x="570" y="301" font-size="11" fill="#4a5260" font-weight="600">priors &amp; edges</text>
  <text x="570" y="316" font-size="10.5" fill="#626b78">archived · superseded · mtime · edges</text>

  <text x="884" y="199" font-size="11.5" fill="#14181f" font-weight="600">Five weighted fields</text>
  <text x="884" y="219" font-size="10.5" fill="#626b78">body 1.0 · heading 3.0 · title 2.0</text>
  <text x="884" y="235" font-size="10.5" fill="#626b78">path 1.5 · ctx 1.0</text>
  <text x="884" y="262" font-size="11.5" fill="#14181f" font-weight="600">wlen is DERIVED from flen</text>
  <text x="884" y="280" font-size="10.5" fill="#626b78">so a field weight is a tune key,</text>
  <text x="884" y="296" font-size="10.5" fill="#626b78">not a committed byte</text>
  <text x="884" y="321" font-size="10.5" fill="#3d6df2">no prose · no floats · no clocks</text>

  <!-- ================= DERIVED ================= -->
  <line x1="861" y1="342" x2="861" y2="380" stroke="#8a93a0" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#g)"/>
  <text x="875" y="366" font-size="10.5" fill="#9aa3af">fux build — seconds, gitignored</text>

  <rect x="534" y="384" width="654" height="128" rx="11" fill="#f5f5f6" stroke="#9aa3af" stroke-width="1.5" stroke-dasharray="7 4"/>
  <text x="556" y="410" font-size="13.5" fill="#4a5260" font-weight="600">THE DERIVED PLANE · .fux/runtime/</text>

  <rect x="556" y="424" width="146" height="70" rx="7" fill="#fff" stroke="#d3d7dd"/>
  <text x="570" y="444" font-size="11" fill="#14181f" font-weight="600">postings</text>
  <text x="570" y="461" font-size="10" fill="#626b78">term-major, 128/block</text>
  <text x="570" y="477" font-size="10" fill="#626b78">62-byte offset table</text>

  <rect x="714" y="424" width="146" height="70" rx="7" fill="#fff" stroke="#d3d7dd"/>
  <text x="728" y="444" font-size="11" fill="#14181f" font-weight="600">docs table</text>
  <text x="728" y="461" font-size="10" fill="#626b78">loc · title · flen</text>
  <text x="728" y="477" font-size="10" fill="#626b78">archived · superseded</text>

  <rect x="872" y="424" width="146" height="70" rx="7" fill="#fff" stroke="#d3d7dd"/>
  <text x="886" y="444" font-size="11" fill="#14181f" font-weight="600">sign codes</text>
  <text x="886" y="461" font-size="10" fill="#626b78">256-bit, per chunk</text>
  <text x="886" y="477" font-size="10" fill="#626b78">Hamming prefilter</text>

  <rect x="1030" y="424" width="136" height="70" rx="7" fill="#fff" stroke="#d3d7dd"/>
  <text x="1044" y="444" font-size="11" fill="#14181f" font-weight="600">graph</text>
  <text x="1044" y="461" font-size="10" fill="#626b78">CSR + communities</text>
  <text x="1044" y="477" font-size="10" fill="#626b78">lazy PPR</text>

  <!-- the law -->
  <rect x="52" y="384" width="446" height="128" rx="11" fill="#fff" stroke="#3d6df2" stroke-width="1.5"/>
  <text x="74" y="412" font-size="13.5" fill="#3d6df2" font-weight="600">The differential law</text>
  <text x="74" y="440" font-size="12" fill="#14181f">Every result the accelerator returns must be</text>
  <text x="74" y="459" font-size="12" fill="#14181f" font-weight="600">byte-identical to the reference scan.</text>
  <text x="74" y="484" font-size="11" fill="#626b78">Delete the derived plane and you lose speed —</text>
  <text x="74" y="500" font-size="11" fill="#626b78">never an answer. That is what makes it disposable.</text>

  <!-- ================= QUERY ================= -->
  <text x="52" y="562" font-size="10.5" fill="#9aa3af" font-weight="600" letter-spacing="1.2">QUERY — EVERY CALL</text>

  <rect x="52" y="578" width="176" height="88" rx="9" fill="#eef3fd" stroke="#3d6df2" stroke-width="1.6"/>
  <text x="140" y="606" font-size="12.5" fill="#14181f" text-anchor="middle" font-weight="600">ask · find · answer</text>
  <text x="140" y="626" font-size="12.5" fill="#14181f" text-anchor="middle" font-weight="600">explain · graph · mcp</text>
  <text x="140" y="649" font-size="10.5" fill="#8a93a0" text-anchor="middle">shares the ingest analyzer</text>

  <rect x="264" y="562" width="212" height="52" rx="9" fill="#fff" stroke="#c9cfd8" stroke-width="1.3"/>
  <text x="282" y="583" font-size="12" fill="#14181f" font-weight="600">accelerator path</text>
  <text x="282" y="602" font-size="10.5" fill="#626b78">bisect → block-max prune → decode</text>

  <rect x="264" y="628" width="212" height="52" rx="9" fill="#fff" stroke="#c9cfd8" stroke-width="1.3"/>
  <text x="282" y="649" font-size="12" fill="#14181f" font-weight="600">reference scan</text>
  <text x="282" y="668" font-size="10.5" fill="#626b78">byte prefilter over the shards</text>

  <line x1="228" y1="606" x2="258" y2="592" stroke="#8a93a0" stroke-width="1.4" marker-end="url(#g)"/>
  <line x1="228" y1="640" x2="258" y2="652" stroke="#8a93a0" stroke-width="1.4" marker-end="url(#g)"/>
  <text x="246" y="626" font-size="9.5" fill="#9aa3af" text-anchor="middle">or</text>

  <rect x="512" y="578" width="184" height="88" rx="9" fill="#fff" stroke="#c9cfd8" stroke-width="1.6"/>
  <text x="604" y="604" font-size="13" fill="#14181f" text-anchor="middle" font-weight="600">rank()</text>
  <text x="604" y="626" font-size="10.5" fill="#626b78" text-anchor="middle">BM25F, k1 1.2, b 0.75</text>
  <text x="604" y="644" font-size="10.5" fill="#626b78" text-anchor="middle">weight, then saturate — once</text>
  <text x="604" y="661" font-size="10" fill="#3d6df2" text-anchor="middle">the only BM25F scorer</text>

  <line x1="476" y1="588" x2="506" y2="606" stroke="#8a93a0" stroke-width="1.4" marker-end="url(#g)"/>
  <line x1="476" y1="654" x2="506" y2="636" stroke="#8a93a0" stroke-width="1.4" marker-end="url(#g)"/>

  <rect x="732" y="578" width="184" height="88" rx="9" fill="#fff" stroke="#9aa3af" stroke-width="1.4" stroke-dasharray="7 4"/>
  <text x="824" y="602" font-size="12.5" fill="#14181f" text-anchor="middle" font-weight="600">after ranking</text>
  <text x="824" y="623" font-size="10.5" fill="#626b78" text-anchor="middle">dense fuse · proximity rerank</text>
  <text x="824" y="641" font-size="10.5" fill="#626b78" text-anchor="middle">both opt-in, both off by default</text>
  <text x="824" y="659" font-size="10" fill="#9aa3af" text-anchor="middle">reorder only — never retrieve</text>
  <line x1="696" y1="622" x2="726" y2="622" stroke="#8a93a0" stroke-width="1.4" marker-end="url(#g)"/>

  <rect x="952" y="578" width="236" height="88" rx="9" fill="#eef3fd" stroke="#3d6df2" stroke-width="1.6"/>
  <text x="1070" y="602" font-size="12.5" fill="#14181f" text-anchor="middle" font-weight="600">refer → answer</text>
  <text x="1070" y="623" font-size="10.5" fill="#626b78" text-anchor="middle">fetch the live document, compare sha</text>
  <text x="1070" y="641" font-size="10.5" fill="#626b78" text-anchor="middle">chunk · rescore passages</text>
  <text x="1070" y="659" font-size="10.5" fill="#3d6df2" text-anchor="middle">cite as path:L12-L40</text>
  <line x1="916" y1="622" x2="946" y2="622" stroke="#3d6df2" stroke-width="1.6" marker-end="url(#b)"/>

  <path d="M 604 512 L 604 572" fill="none" stroke="#8a93a0" stroke-width="1.3" stroke-dasharray="4 4"/>
  <path d="M 370 512 L 370 556" fill="none" stroke="#8a93a0" stroke-width="1.3" stroke-dasharray="4 4"/>

  <line x1="52" y1="712" x2="1188" y2="712" stroke="#e4e4e0" stroke-width="1"/>
  <text x="52" y="742" font-size="10.5" fill="#9aa3af" font-weight="600" letter-spacing="1.1">THE LAWS THIS SHAPE ENFORCES</text>
  <text x="52" y="770" font-size="11.5" fill="#4a5260"><tspan font-weight="600">L1</tspan> stdlib only — no dependency may enter src/</text>
  <text x="52" y="792" font-size="11.5" fill="#4a5260"><tspan font-weight="600">L2</tspan> no durable content — the index holds no prose</text>
  <text x="52" y="814" font-size="11.5" fill="#4a5260"><tspan font-weight="600">L3</tspan> byte-deterministic — same sources, same bytes, any machine</text>
  <text x="646" y="770" font-size="11.5" fill="#4a5260"><tspan font-weight="600">L4</tspan> offline by default — two networked paths, both named</text>
  <text x="646" y="792" font-size="11.5" fill="#4a5260"><tspan font-weight="600">L5</tspan> hashed meta — display text only where policy allows it</text>
  <text x="646" y="814" font-size="11.5" fill="#3d6df2" font-weight="600">The committed plane must be sufficient to answer.</text>
  <text x="646" y="832" font-size="11.5" fill="#626b78">The derived plane may make an answer faster or better — never possible.</text>
</svg>
