<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1224" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5" fill="none" stroke="#3d6df2" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5" fill="none" stroke="#1d8a5e" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5" fill="none" stroke="#8a93a0" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1240" height="1198" fill="#fcfcfb"/>

  <text x="48" y="46" font-size="22" fill="#14181f" font-weight="600">Fux — the mechanism</text>
  <text x="48" y="70" font-size="12" fill="#626b78">2.0.0-alpha.2 · 2026-08-26 · fux.index.v2 / analyzer v2 / fux.runtime.v4 · lexical only, no model anywhere</text>

  <rect x="880" y="30" width="14" height="14" rx="3" fill="#eef3fd" stroke="#3d6df2" stroke-width="1.6"/>
  <text x="902" y="42" font-size="11.5" fill="#4a5260">committed to git</text>
  <rect x="1010" y="30" width="14" height="14" rx="3" fill="#ffffff" stroke="#c9cfd8" stroke-width="1.4"/>
  <text x="1032" y="42" font-size="11.5" fill="#4a5260">derived</text>
  <rect x="1104" y="30" width="14" height="14" rx="3" fill="#eaf7f0" stroke="#1d8a5e" stroke-width="1.8"/>
  <text x="1126" y="42" font-size="11.5" fill="#1d8a5e">new in alpha.2</text>


  <!-- ================= DECODE (W-86) ================= -->
  <text x="48" y="244" font-size="11" fill="#9aa3af" font-weight="600" letter-spacing="1.1">DECODE — BYTES BECOME MARKDOWN, IN ONE PLACE</text>

  <rect x="48" y="258" width="1144" height="76" rx="10" fill="#f7fbf9" stroke="#1d8a5e" stroke-width="1.4" stroke-dasharray="4 3"/>

  <rect x="68" y="272" width="250" height="48" rx="8" fill="#eaf7f0" stroke="#1d8a5e" stroke-width="1.8"/>
  <text x="82" y="292" font-size="12.5" fill="#14181f" font-weight="600">.fux/decoders/ — 16 modules</text>
  <text x="82" y="310" font-size="11" fill="#1d8a5e">setup copies them; THE COPY RUNS</text>

  <rect x="334" y="272" width="266" height="48" rx="8" fill="#ffffff" stroke="#c9cfd8" stroke-width="1.4"/>
  <text x="348" y="292" font-size="12.5" fill="#14181f" font-weight="600">30 extensions, all stdlib</text>
  <text x="348" y="310" font-size="11" fill="#4a5260">pdf · docx · pptx · xlsx · odf · html · eml</text>

  <rect x="616" y="272" width="252" height="48" rx="8" fill="#ffffff" stroke="#c9cfd8" stroke-width="1.4"/>
  <text x="630" y="292" font-size="12.5" fill="#14181f" font-weight="600">bytes → Markdown | None</text>
  <text x="630" y="310" font-size="11" fill="#4a5260">deterministic · offline · no content kept</text>

  <rect x="884" y="272" width="288" height="48" rx="8" fill="#eaf7f0" stroke="#1d8a5e" stroke-width="1.8"/>
  <text x="898" y="292" font-size="12.5" fill="#14181f" font-weight="600">None → .fux/enrich/queue.tsv</text>
  <text x="898" y="310" font-size="11" fill="#1d8a5e">a model must read this · committed</text>

  <!-- ================= INGEST ================= -->
  <text x="48" y="106" font-size="11" fill="#9aa3af" font-weight="600" letter-spacing="1.1">INGEST — WALK, FETCH, ANALYSE, DISCARD</text>

  <rect x="48" y="120" width="212" height="92" rx="10" fill="#eef3fd" stroke="#3d6df2" stroke-width="1.8"/>
  <text x="64" y="144" font-size="13" fill="#14181f" font-weight="600">.fux/sources/</text>
  <text x="64" y="164" font-size="11.5" fill="#4a5260">dirs · urls · types</text>
  <text x="64" y="184" font-size="11" fill="#8a93a0">one entry per line</text>
  <text x="64" y="201" font-size="11" fill="#8a93a0">loader-sorted — order cannot</text>

  <rect x="284" y="120" width="232" height="92" rx="10" fill="#eaf7f0" stroke="#1d8a5e" stroke-width="1.8"/>
  <text x="300" y="144" font-size="13" fill="#14181f" font-weight="600">fetch_all — PARALLEL</text>
  <text x="300" y="164" font-size="11.5" fill="#4a5260">MAX_PARALLEL declared by the</text>
  <text x="300" y="181" font-size="11.5" fill="#4a5260">fetcher; min(declared, configured)</text>
  <text x="300" y="201" font-size="11" fill="#1d8a5e" font-weight="600">absent = 1 · cdp declares 1</text>

  <rect x="540" y="120" width="200" height="92" rx="10" fill="#ffffff" stroke="#c9cfd8" stroke-width="1.4"/>
  <text x="556" y="144" font-size="13" fill="#14181f" font-weight="600">analyzer v2</text>
  <text x="556" y="164" font-size="11.5" fill="#4a5260">split · lower · stopwords</text>
  <text x="556" y="181" font-size="11.5" fill="#4a5260">Porter stem · blake2b 16-hex</text>
  <text x="556" y="201" font-size="11" fill="#8a93a0">order is load-bearing</text>

  <rect x="764" y="120" width="196" height="92" rx="10" fill="#ffffff" stroke="#c9cfd8" stroke-width="1.4"/>
  <text x="780" y="144" font-size="13" fill="#14181f" font-weight="600">priors</text>
  <text x="780" y="164" font-size="11.5" fill="#4a5260">supersedes: · archived</text>
  <text x="780" y="181" font-size="11.5" fill="#4a5260">git commit recency (mtime)</text>
  <text x="780" y="201" font-size="11" fill="#8a93a0">no wall clock at write time</text>

  <rect x="984" y="120" width="208" height="92" rx="10" fill="#eaf7f0" stroke="#1d8a5e" stroke-width="1.8"/>
  <text x="1000" y="144" font-size="13" fill="#14181f" font-weight="600">url health</text>
  <text x="1000" y="164" font-size="11.5" fill="#4a5260">runtime/url-state.json</text>
  <text x="1000" y="181" font-size="11.5" fill="#4a5260">fail_streak · last_seen_run</text>
  <text x="1000" y="201" font-size="11" fill="#1d8a5e" font-weight="600">RUNS, never seconds</text>

  <line x1="260" y1="166" x2="278" y2="166" stroke="#3d6df2" stroke-width="1.8" marker-end="url(#a)"/>
  <line x1="516" y1="166" x2="534" y2="166" stroke="#3d6df2" stroke-width="1.8" marker-end="url(#a)"/>
  <line x1="740" y1="166" x2="758" y2="166" stroke="#3d6df2" stroke-width="1.8" marker-end="url(#a)"/>

  <!-- ================= COMMITTED PLANE ================= -->
  <rect x="48" y="358" width="1144" height="158" rx="12" fill="#eef3fd" stroke="#3d6df2" stroke-width="2.2"/>
  <text x="68" y="386" font-size="13.5" fill="#14181f" font-weight="700">THE COMMITTED PLANE · .fux/index/{00..ff}.jsonl</text>
  <text x="68" y="406" font-size="11.5" fill="#4a5260">256 shards, doc-major, one canonical JSON line per document · the header pins schema + analyzer</text>

  <rect x="68" y="420" width="256" height="80" rx="8" fill="#ffffff" stroke="#c9cfd8" stroke-width="1.2"/>
  <text x="84" y="442" font-size="12" fill="#14181f" font-weight="600">identity</text>
  <text x="84" y="462" font-size="11" fill="#4a5260">id · src · loc · sha · ver</text>
  <text x="84" y="480" font-size="11" fill="#4a5260">mode · meta</text>

  <rect x="340" y="420" width="286" height="80" rx="8" fill="#ffffff" stroke="#c9cfd8" stroke-width="1.2"/>
  <text x="356" y="442" font-size="12" fill="#14181f" font-weight="600">retrieval</text>
  <text x="356" y="462" font-size="11" fill="#4a5260">terms{hash: [tf x5]} · flen[5]</text>
  <text x="356" y="480" font-size="11" fill="#4a5260">title · phrases</text>

  <rect x="642" y="420" width="262" height="80" rx="8" fill="#ffffff" stroke="#c9cfd8" stroke-width="1.2"/>
  <text x="658" y="442" font-size="12" fill="#14181f" font-weight="600">priors &amp; edges</text>
  <text x="658" y="462" font-size="11" fill="#4a5260">archived · superseded</text>
  <text x="658" y="480" font-size="11" fill="#4a5260">mtime · edges</text>

  <rect x="920" y="420" width="256" height="80" rx="8" fill="#ffffff" stroke="#c9cfd8" stroke-width="1.2"/>
  <text x="936" y="442" font-size="12" fill="#14181f" font-weight="600">five weighted fields</text>
  <text x="936" y="462" font-size="11" fill="#4a5260">body 1.0 · heading 3.0 · title 2.0</text>
  <text x="936" y="480" font-size="11" fill="#4a5260">path 1.5 · ctx 1.0</text>

  <text x="68" y="512" font-size="11" fill="#3d6df2" font-weight="600">no prose · no floats · no clocks · no vectors — the dense lane and its model were deleted 2026-08-25</text>

  <!-- ================= DERIVED PLANE ================= -->
  <text x="48" y="554" font-size="11" fill="#9aa3af" font-weight="600" letter-spacing="1.1">THE DERIVED PLANE · .fux/runtime/ — gitignored, rebuilt by `fux build` in seconds</text>

  <rect x="48" y="568" width="184" height="86" rx="10" fill="#ffffff" stroke="#c9cfd8" stroke-width="1.4"/>
  <text x="64" y="592" font-size="12.5" fill="#14181f" font-weight="600">postings</text>
  <text x="64" y="612" font-size="11" fill="#4a5260">term-major, 128/block</text>
  <text x="64" y="630" font-size="11" fill="#4a5260">62-byte offset table</text>

  <rect x="246" y="568" width="176" height="86" rx="10" fill="#ffffff" stroke="#c9cfd8" stroke-width="1.4"/>
  <text x="262" y="592" font-size="12.5" fill="#14181f" font-weight="600">docs table</text>
  <text x="262" y="612" font-size="11" fill="#4a5260">loc · title · flen</text>
  <text x="262" y="630" font-size="11" fill="#4a5260">archived · superseded</text>

  <rect x="436" y="568" width="164" height="86" rx="10" fill="#ffffff" stroke="#c9cfd8" stroke-width="1.4"/>
  <text x="452" y="592" font-size="12.5" fill="#14181f" font-weight="600">graph</text>
  <text x="452" y="612" font-size="11" fill="#4a5260">CSR + communities</text>
  <text x="452" y="630" font-size="11" fill="#4a5260">lazy PPR</text>

  <rect x="614" y="568" width="176" height="86" rx="10" fill="#ffffff" stroke="#c9cfd8" stroke-width="1.4"/>
  <text x="630" y="592" font-size="12.5" fill="#14181f" font-weight="600">fetch-cache</text>
  <text x="630" y="612" font-size="11" fill="#4a5260">TTL-bounded</text>
  <text x="630" y="630" font-size="11" fill="#c2410c" font-weight="600">the ONLY wall clock</text>

  <rect x="804" y="568" width="176" height="86" rx="10" fill="#eaf7f0" stroke="#1d8a5e" stroke-width="1.6"/>
  <text x="820" y="592" font-size="12.5" fill="#14181f" font-weight="600">dirty list</text>
  <text x="820" y="612" font-size="11" fill="#4a5260">post-commit writes it</text>
  <text x="820" y="630" font-size="11" fill="#1d8a5e" font-weight="600">refer now writes it too</text>

  <rect x="994" y="568" width="182" height="86" rx="10" fill="#eaf7f0" stroke="#1d8a5e" stroke-width="1.6"/>
  <text x="1010" y="592" font-size="12.5" fill="#14181f" font-weight="600">last-cited</text>
  <text x="1010" y="612" font-size="11" fill="#4a5260">(loc, sha) of the last answer</text>
  <text x="1010" y="630" font-size="11" fill="#1d8a5e" font-weight="600">a report, NOT a memo</text>

  <rect x="48" y="670" width="1128" height="50" rx="8" fill="#ffffff" stroke="#c9cfd8" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="66" y="691" font-size="12" fill="#14181f" font-weight="600">The differential law —</text>
  <text x="212" y="691" font-size="12" fill="#4a5260">every result the accelerator returns is byte-identical to the reference scan.</text>
  <text x="66" y="710" font-size="11.5" fill="#626b78">Delete the derived plane and you lose speed, never an answer. That is what makes it disposable.</text>

  <!-- ================= QUERY ================= -->
  <text x="48" y="762" font-size="11" fill="#9aa3af" font-weight="600" letter-spacing="1.1">QUERY — EVERY CALL</text>

  <rect x="48" y="776" width="196" height="78" rx="10" fill="#ffffff" stroke="#c9cfd8" stroke-width="1.4"/>
  <text x="64" y="800" font-size="12.5" fill="#14181f" font-weight="600">ask · find · answer</text>
  <text x="64" y="820" font-size="12.5" fill="#14181f" font-weight="600">explain · graph · path</text>
  <text x="64" y="840" font-size="11" fill="#8a93a0">shares the ingest analyzer</text>

  <rect x="268" y="776" width="212" height="78" rx="10" fill="#ffffff" stroke="#c9cfd8" stroke-width="1.4"/>
  <text x="284" y="800" font-size="12.5" fill="#14181f" font-weight="600">accelerator or scan</text>
  <text x="284" y="820" font-size="11" fill="#4a5260">bisect → block-max → decode</text>
  <text x="284" y="838" font-size="11" fill="#4a5260">or a byte prefilter over shards</text>

  <rect x="504" y="776" width="196" height="78" rx="10" fill="#ffffff" stroke="#c9cfd8" stroke-width="1.4"/>
  <text x="520" y="800" font-size="12.5" fill="#14181f" font-weight="600">rank() — BM25F</text>
  <text x="520" y="820" font-size="11" fill="#4a5260">k1 1.2 · b 0.75</text>
  <text x="520" y="838" font-size="11" fill="#4a5260">weight, then saturate — once</text>

  <rect x="724" y="776" width="196" height="78" rx="10" fill="#ffffff" stroke="#c9cfd8" stroke-width="1.4"/>
  <text x="740" y="800" font-size="12.5" fill="#14181f" font-weight="600">proximity rerank</text>
  <text x="740" y="820" font-size="11" fill="#4a5260">opt-in, off by default</text>
  <text x="740" y="838" font-size="11" fill="#4a5260">reorders — never retrieves</text>

  <rect x="944" y="776" width="232" height="78" rx="10" fill="#eef3fd" stroke="#3d6df2" stroke-width="1.8"/>
  <text x="960" y="800" font-size="12.5" fill="#14181f" font-weight="600">refer → answer</text>
  <text x="960" y="820" font-size="11" fill="#4a5260">fetch the live document,</text>
  <text x="960" y="838" font-size="11" fill="#4a5260">compare sha, cite path:L12-L40</text>

  <line x1="244" y1="815" x2="262" y2="815" stroke="#3d6df2" stroke-width="1.8" marker-end="url(#a)"/>
  <line x1="480" y1="815" x2="498" y2="815" stroke="#3d6df2" stroke-width="1.8" marker-end="url(#a)"/>
  <line x1="700" y1="815" x2="718" y2="815" stroke="#3d6df2" stroke-width="1.8" marker-end="url(#a)"/>
  <line x1="920" y1="815" x2="938" y2="815" stroke="#3d6df2" stroke-width="1.8" marker-end="url(#a)"/>

  <!-- THE DETECTOR LOOP -->
  <path d="M 1060 854 L 1060 884 L 620 884" fill="none" stroke="#1d8a5e" stroke-width="2.2"/>
  <path d="M 620 884 L 28 884 L 28 166 L 42 166" fill="none" stroke="#1d8a5e" stroke-width="2.2" marker-end="url(#g)"/>
  <rect x="626" y="868" width="404" height="32" rx="8" fill="#eaf7f0" stroke="#1d8a5e" stroke-width="1.4"/>
  <text x="828" y="889" font-size="12" fill="#1d8a5e" text-anchor="middle" font-weight="600">sha differs → mark dirty → narrowed re-ingest fixes ranking</text>

  <text x="196" y="920" font-size="12.5" fill="#14181f" font-weight="700">THE LOOP THAT CLOSES THE GAP</text>
  <text x="196" y="940" font-size="12" fill="#4a5260">Before this, refer computed the verdict and threw it away — so a changed URL kept its old terms, stopped</text>
  <text x="196" y="958" font-size="12" fill="#4a5260">ranking, was never cited, and nothing noticed. It buys RECALL, not correctness: a changed document could</text>
  <text x="196" y="976" font-size="12" fill="#4a5260">never be mis-answered, only fail to surface.</text>

  <!-- ================= AGENT SURFACE ================= -->
  <text x="48" y="1002" font-size="11" fill="#9aa3af" font-weight="600" letter-spacing="1.1">THE AGENT SURFACE — written by `fux setup`, owned by the consumer, never rewritten</text>

  <rect x="48" y="1016" width="164" height="74" rx="10" fill="#ffffff" stroke="#c9cfd8" stroke-width="1.4"/>
  <text x="64" y="1040" font-size="12.5" fill="#14181f" font-weight="600">fux setup</text>
  <text x="64" y="1060" font-size="11" fill="#4a5260">declared vendors only,</text>
  <text x="64" y="1078" font-size="11" fill="#4a5260">never sniffed</text>

  <rect x="236" y="1016" width="300" height="74" rx="10" fill="#eaf7f0" stroke="#1d8a5e" stroke-width="1.6"/>
  <text x="252" y="1040" font-size="12.5" fill="#14181f" font-weight="600">.claude/skills/ · .kiro/skills/</text>
  <text x="252" y="1060" font-size="11" fill="#4a5260">the SAME template bytes at both paths —</text>
  <text x="252" y="1078" font-size="11" fill="#1d8a5e" font-weight="600">agreement by construction</text>

  <rect x="560" y="1016" width="616" height="74" rx="10" fill="#eaf7f0" stroke="#1d8a5e" stroke-width="1.6"/>
  <text x="576" y="1040" font-size="12.5" fill="#14181f" font-weight="600">the invocation ladder — fux → uv run fux → ./.venv/bin/fux → python -m fux.cli</text>
  <text x="576" y="1060" font-size="11" fill="#4a5260">Probe with --version, cache per session. NEVER activate a venv, modify PATH, or install anything.</text>
  <text x="576" y="1078" font-size="11" fill="#c2410c" font-weight="600">An unactivated .venv used to read as "not installed" — and sent agents silently to grep.</text>

  <line x1="212" y1="1053" x2="230" y2="1053" stroke="#3d6df2" stroke-width="1.8" marker-end="url(#a)"/>

  <!-- ================= LAWS ================= -->
  <line x1="48" y1="1118" x2="1192" y2="1118" stroke="#e4e4e0" stroke-width="1"/>
  <text x="48" y="1144" font-size="11" fill="#9aa3af" font-weight="600" letter-spacing="1.1">THE LAWS THIS SHAPE ENFORCES</text>
  <text x="48" y="1168" font-size="11.5" fill="#4a5260">L1 stdlib only — threading is stdlib, so the pool costs nothing</text>
  <text x="470" y="1168" font-size="11.5" fill="#4a5260">L2 no durable content — the index holds statistics</text>
  <text x="856" y="1168" font-size="11.5" fill="#4a5260">L3 deterministic — the sort, not the loop</text>
  <text x="48" y="1186" font-size="11.5" fill="#4a5260">L4 offline by default — two named networked paths</text>
  <text x="470" y="1186" font-size="11.5" fill="#4a5260">L5 hashed meta by default for non-git sources</text>
  <text x="856" y="1186" font-size="11.5" fill="#4a5260">L6 say "index", not "db" · L7 Python ≥ 3.11</text>
  <text x="48" y="1204" font-size="11.5" fill="#4a5260">L8 what fux retains about USE is hashed, bounded and local — the only law about the reader, not the corpus</text>
</svg>
