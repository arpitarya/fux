<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 560" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5" fill="none" stroke="#3d6df2" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5" fill="none" stroke="#8a93a0" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1020" height="560" fill="#fcfcfb"/>

  <text x="60" y="52" font-size="23" fill="#14181f" font-weight="600">Fux, in one picture</text>
  <text x="60" y="78" font-size="13" fill="#626b78">A search index for your documents that lives in your git repo — as text you can read and review.</text>

  <!-- 1 -->
  <rect x="60" y="128" width="268" height="182" rx="12" fill="#ffffff" stroke="#c9cfd8" stroke-width="1.5"/>
  <circle cx="88" cy="160" r="12" fill="#eef3fd"/>
  <text x="88" y="165" font-size="12" fill="#3d6df2" text-anchor="middle" font-weight="700">1</text>
  <text x="110" y="165" font-size="15.5" fill="#14181f" font-weight="600">Your documents</text>
  <text x="86" y="196" font-size="12.5" fill="#626b78">Stay exactly where they are —</text>
  <text x="86" y="215" font-size="12.5" fill="#626b78">the repo, a wiki, a web page.</text>
  <text x="86" y="240" font-size="12.5" fill="#1d8a5e" font-weight="600">PDFs, Word, decks, sheets,</text>
  <text x="86" y="258" font-size="12.5" fill="#1d8a5e" font-weight="600">email, notebooks, web pages.</text>
  <text x="86" y="281" font-size="12.5" fill="#14181f" font-weight="600">Fux never copies them</text>
  <text x="86" y="299" font-size="12.5" fill="#14181f" font-weight="600">and never stores their text.</text>

  <!-- 2 -->
  <rect x="376" y="128" width="268" height="182" rx="12" fill="#eef3fd" stroke="#3d6df2" stroke-width="2.2"/>
  <circle cx="404" cy="160" r="12" fill="#ffffff"/>
  <text x="404" y="165" font-size="12" fill="#3d6df2" text-anchor="middle" font-weight="700">2</text>
  <text x="426" y="165" font-size="15.5" fill="#14181f" font-weight="600">The index</text>
  <text x="402" y="199" font-size="12" fill="#8a93a0">.fux/index/ — one line per document</text>
  <text x="402" y="228" font-size="12.5" fill="#626b78">Small enough to commit. Plain</text>
  <text x="402" y="248" font-size="12.5" fill="#626b78">text, so it diffs and merges.</text>
  <text x="402" y="280" font-size="13" fill="#3d6df2" font-weight="600">Clone the repo and ask.</text>

  <!-- 3 -->
  <rect x="692" y="128" width="268" height="182" rx="12" fill="#ffffff" stroke="#c9cfd8" stroke-width="1.5"/>
  <circle cx="720" cy="160" r="12" fill="#eef3fd"/>
  <text x="720" y="165" font-size="12" fill="#3d6df2" text-anchor="middle" font-weight="700">3</text>
  <text x="742" y="165" font-size="15.5" fill="#14181f" font-weight="600">The answer</text>
  <text x="718" y="200" font-size="12.5" fill="#626b78">The index says which document</text>
  <text x="718" y="221" font-size="12.5" fill="#626b78">answers you. The words come</text>
  <text x="718" y="242" font-size="12.5" fill="#626b78">back from that document —</text>
  <text x="718" y="272" font-size="12.5" fill="#14181f" font-weight="600">quoted, with line numbers.</text>

  <line x1="328" y1="219" x2="370" y2="219" stroke="#3d6df2" stroke-width="2" marker-end="url(#a)"/>
  <line x1="644" y1="219" x2="686" y2="219" stroke="#3d6df2" stroke-width="2" marker-end="url(#a)"/>

  <!-- the loop that is the point -->
  <path d="M 826 310 L 826 372 L 194 372 L 194 316" fill="none" stroke="#8a93a0" stroke-width="1.6" marker-end="url(#m)"/>
  <rect x="316" y="356" width="388" height="30" rx="8" fill="#fcfcfb"/>
  <text x="510" y="377" font-size="12.5" fill="#4a5260" text-anchor="middle">read back from the file as it stands today, and checked</text>

  <!-- what there isn't -->
  <line x1="60" y1="430" x2="960" y2="430" stroke="#e4e4e0" stroke-width="1"/>
  <text x="60" y="462" font-size="11" fill="#9aa3af" font-weight="600" letter-spacing="1.1">WHAT THERE ISN'T</text>
  <text x="60" y="492" font-size="13" fill="#4a5260">No server to run.</text>
  <text x="290" y="492" font-size="13" fill="#4a5260">No vector database.</text>
  <text x="540" y="492" font-size="13" fill="#4a5260">No API key, no bill.</text>
  <text x="790" y="492" font-size="13" fill="#4a5260">No second copy to go stale.</text>
  <text x="790" y="512" font-size="11.5" fill="#9aa3af">Answers quote the original.</text>
  <text x="60" y="512" font-size="11.5" fill="#9aa3af">It is a file in your repo.</text>
  <text x="290" y="512" font-size="11.5" fill="#9aa3af">Ranking is arithmetic.</text>
  <text x="540" y="512" font-size="11.5" fill="#9aa3af">Nothing calls a model.</text>
</svg>
