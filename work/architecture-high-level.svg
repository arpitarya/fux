<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 752" width="1020" height="752" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10" fill="none" stroke="#3d6df2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10" fill="none" stroke="#1d8a5e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10" fill="none" stroke="#8a93a0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10" fill="none" stroke="#c2410c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="1020" height="752" fill="#fcfcfb"/>
<text x="46" y="52" font-size="23" font-weight="600" fill="#14181f">Fux, in three boxes</text>
<text x="46" y="76" font-size="13" fill="#626b78">A search index for your written knowledge. The index is committed; the documents never move.</text>
<rect x="60" y="128" width="268" height="196" rx="12" fill="#ffffff" stroke="#c9cfd8" stroke-width="1.4"/>
<circle cx="88" cy="158" r="12" fill="#c9cfd8"/>
<text x="88" y="162" font-size="12.5" fill="#4a5260" font-weight="600" text-anchor="middle">1</text>
<text x="110" y="163" font-size="14" fill="#14181f" font-weight="600">Your documents stay put</text>
<text x="80" y="190" font-size="12.5" fill="#4a5260">Markdown, PDFs, spreadsheets,</text>
<text x="80" y="208" font-size="12.5" fill="#4a5260">decks, wiki pages behind a login.</text>
<text x="80" y="226" font-size="12.5" fill="#4a5260">In the repo, or in the system</text>
<text x="80" y="244" font-size="12.5" fill="#4a5260">that owns them.</text>
<text x="80" y="262" font-size="12.5" fill="#4a5260"></text>
<text x="80" y="280" font-size="12.5" fill="#4a5260">Fux copies none of them.</text>
<rect x="376" y="128" width="268" height="196" rx="12" fill="#eef3fd" stroke="#3d6df2" stroke-width="1.8"/>
<circle cx="404" cy="158" r="12" fill="#3d6df2"/>
<text x="404" y="162" font-size="12.5" fill="#ffffff" font-weight="600" text-anchor="middle">2</text>
<text x="426" y="163" font-size="14" fill="#14181f" font-weight="600">A small index, committed</text>
<text x="396" y="190" font-size="12.5" fill="#4a5260" font-family="ui-monospace, Menlo, monospace">.fux/index/ -- 256 JSONL shards, one</text>
<text x="396" y="208" font-size="12.5" fill="#4a5260">line per document. Statistics only:</text>
<text x="396" y="226" font-size="12.5" fill="#4a5260">term counts, headings, edges.</text>
<text x="396" y="244" font-size="12.5" fill="#4a5260"></text>
<text x="396" y="262" font-size="12.5" fill="#4a5260">It diffs like code. Every clone has it.</text>
<text x="396" y="280" font-size="12.5" fill="#4a5260">Read it with Python, or with Node.</text>
<rect x="692" y="128" width="268" height="196" rx="12" fill="#ffffff" stroke="#c9cfd8" stroke-width="1.4"/>
<circle cx="720" cy="158" r="12" fill="#c9cfd8"/>
<text x="720" y="162" font-size="12.5" fill="#4a5260" font-weight="600" text-anchor="middle">3</text>
<text x="742" y="163" font-size="14" fill="#14181f" font-weight="600">Ranked, cited answers</text>
<text x="712" y="190" font-size="12.5" fill="#4a5260" font-family="ui-monospace, Menlo, monospace">ask ranks. find locates. answer</text>
<text x="712" y="208" font-size="12.5" fill="#4a5260">re-reads the cited lines from the</text>
<text x="712" y="226" font-size="12.5" fill="#4a5260">source and says whether they still</text>
<text x="712" y="244" font-size="12.5" fill="#4a5260">say what the index thinks.</text>
<text x="712" y="262" font-size="12.5" fill="#4a5260"></text>
<text x="712" y="280" font-size="12.5" fill="#4a5260">No server. No model. No API key.</text>
<path d="M334,226 L370,226" fill="none" stroke="#3d6df2" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M650,226 L686,226" fill="none" stroke="#3d6df2" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="327" y="203" width="50" height="17" rx="5" fill="#fcfcfb" stroke="none"/>
<text x="352" y="215" font-size="10.5" fill="#626b78" text-anchor="middle">ingest</text>
<rect x="646" y="203" width="44" height="17" rx="5" fill="#fcfcfb" stroke="none"/>
<text x="668" y="215" font-size="10.5" fill="#626b78" text-anchor="middle">query</text>
<path d="M826,324 L826,378 L194,378 L194,330" fill="none" stroke="#8a93a0" stroke-width="1.6" marker-end="url(#m)" stroke-linejoin="round"/>
<rect x="300" y="371" width="421" height="17" rx="5" fill="#fcfcfb" stroke="none"/>
<text x="510" y="383" font-size="10.5" fill="#626b78" text-anchor="middle">answer re-reads the source -- a changed document is marked for re-index</text>
<rect x="60" y="414" width="900" height="56" rx="10" fill="#eaf7f0" stroke="#1d8a5e" stroke-width="1.8"/>
<text x="80" y="438" font-size="13" fill="#14181f" font-weight="600">And when it isn't sure, it says so.</text>
<text x="80" y="457" font-size="11.5" fill="#4a5260">Every result carries a band: none - partial - weak - grounded. An unrelated question gets "No confident matches", never the nearest noise.</text>
<text x="60" y="512" font-size="11" fill="#9aa3af" font-weight="600" letter-spacing="1.1">WHAT THERE ISN'T</text>
<line x1="60" y1="522" x2="960" y2="522" stroke="#e4e4e0" stroke-width="1"/>
<text x="60" y="546" font-size="13" fill="#4a5260" font-weight="600">No server</text>
<text x="60" y="564" font-size="11.5" fill="#8a93a0">Nothing to host, nothing to run.</text>
<text x="290" y="546" font-size="13" fill="#4a5260" font-weight="600">No vector database</text>
<text x="290" y="564" font-size="11.5" fill="#8a93a0">Ranking is BM25F arithmetic.</text>
<text x="532" y="546" font-size="13" fill="#4a5260" font-weight="600">No model on the path</text>
<text x="532" y="564" font-size="11.5" fill="#8a93a0">Not at index, not at query time.</text>
<text x="788" y="546" font-size="13" fill="#4a5260" font-weight="600">No second copy</text>
<text x="788" y="564" font-size="11.5" fill="#8a93a0">Statistics, never content.</text>
<rect x="60" y="590" width="900" height="78" rx="10" fill="#ffffff" stroke="#c9cfd8" stroke-width="1.4"/>
<text x="80" y="614" font-size="13" fill="#14181f" font-weight="600">It indexes documents, not code.</text>
<text x="80" y="633" font-size="11.5" fill="#4a5260">No parser runs over source files -- no AST, no symbols, no call graph -- and no source extension is on the default type list.</text>
<text x="80" y="650" font-size="11.5" fill="#8a93a0">Pair fux with a code-graph tool when you want structure. Fux covers what you wrote down.</text>
<line x1="60" y1="698" x2="960" y2="698" stroke="#e4e4e0" stroke-width="1"/>
<text x="60" y="712" font-size="10.5" fill="#8a93a0">Drawn from the code, 2026-09-12. Detail: architecture-detailed.svg. Query paths: architecture-ask.svg, architecture-answer.svg. Decoding: architecture-decoders.svg.</text>
</svg>
