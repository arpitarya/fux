<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#5f6b7a" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#3d6df2" stroke-width="1.8" stroke-linecap="round"/>
    </marker>
  </defs>

  <rect width="960" height="560" fill="#fcfcfb"/>
  <text x="40" y="46" font-size="19" fill="#0b0b0b" font-weight="600">Fux — six components</text>
  <text x="40" y="66" font-size="11" fill="#898781">Blue is committed to git. Grey dashed is derived: delete it and you lose speed, never an answer.</text>

  <!-- 1 SOURCES -->
  <rect x="40" y="90" width="180" height="110" rx="12" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.5"/>
  <text x="130" y="130" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="600">Sources</text>
  <text x="130" y="152" font-size="11" fill="#52514e" text-anchor="middle">repo docs · wikis · web</text>
  <text x="130" y="170" font-size="11" fill="#52514e" text-anchor="middle">keep all the content</text>

  <!-- 2 INGEST -->
  <line x1="220" y1="145" x2="268" y2="145" stroke="#5f6b7a" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="272" y="90" width="180" height="110" rx="12" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.5"/>
  <text x="362" y="130" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="600">Ingest</text>
  <text x="362" y="152" font-size="11" fill="#52514e" text-anchor="middle">reads each doc, keeps only</text>
  <text x="362" y="170" font-size="11" fill="#52514e" text-anchor="middle">what's needed to find it</text>

  <!-- ENRICHMENT — an input, not a component -->
  <rect x="40" y="240" width="212" height="104" rx="12" fill="#eef3fd" stroke="#3d6df2" stroke-width="1.5" stroke-dasharray="7 4"/>
  <text x="146" y="270" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="600">Enrichment</text>
  <text x="146" y="292" font-size="11" fill="#52514e" text-anchor="middle">your coding agent writes it,</text>
  <text x="146" y="310" font-size="11" fill="#52514e" text-anchor="middle">keyed by the doc's sha</text>
  <text x="146" y="328" font-size="11" fill="#52514e" text-anchor="middle">words the document never says</text>
  <text x="146" y="364" font-size="10" fill="#898781" text-anchor="middle">an input, not a component:</text>
  <text x="146" y="379" font-size="10" fill="#898781" text-anchor="middle">fux never calls a model</text>
  <line x1="254" y1="262" x2="338" y2="206" stroke="#3d6df2" stroke-width="1.6" marker-end="url(#b)"/>

  <!-- 3 INDEX -->
  <line x1="452" y1="145" x2="500" y2="145" stroke="#3d6df2" stroke-width="1.8" marker-end="url(#b)"/>
  <rect x="504" y="78" width="200" height="134" rx="12" fill="#eef3fd" stroke="#3d6df2" stroke-width="1.8"/>
  <text x="604" y="112" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="600">The Index</text>
  <text x="604" y="134" font-size="11" fill="#52514e" text-anchor="middle">one JSONL line per doc</text>
  <text x="604" y="152" font-size="11" fill="#52514e" text-anchor="middle">lives in git — diffable,</text>
  <text x="604" y="170" font-size="11" fill="#52514e" text-anchor="middle">mergeable, versioned</text>
  <text x="604" y="192" font-size="11" fill="#3d6df2" text-anchor="middle" font-weight="600">clone it and query — no build</text>

  <!-- 4 ACCELERATOR -->
  <line x1="604" y1="212" x2="604" y2="256" stroke="#5f6b7a" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <rect x="504" y="260" width="200" height="96" rx="12" fill="#f4f4f6" stroke="#9aa3af" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="604" y="296" font-size="14" fill="#52514e" text-anchor="middle" font-weight="600">Accelerator</text>
  <text x="604" y="318" font-size="11" fill="#898781" text-anchor="middle">derived locally for speed</text>
  <text x="604" y="336" font-size="11" fill="#898781" text-anchor="middle">disposable · never committed</text>

  <!-- 5 ASK -->
  <rect x="740" y="78" width="140" height="134" rx="12" fill="#eef3fd" stroke="#3d6df2" stroke-width="1.8"/>
  <text x="810" y="126" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="600">fux ask</text>
  <text x="810" y="148" font-size="11" fill="#52514e" text-anchor="middle">rank in index →</text>
  <text x="810" y="166" font-size="11" fill="#52514e" text-anchor="middle">fetch cited docs →</text>
  <text x="810" y="184" font-size="11" fill="#52514e" text-anchor="middle">cited answer</text>
  <line x1="704" y1="145" x2="736" y2="145" stroke="#3d6df2" stroke-width="1.8" marker-end="url(#b)"/>
  <line x1="740" y1="200" x2="710" y2="272" stroke="#9aa3af" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="716" y="246" font-size="10" fill="#898781">uses when present</text>

  <!-- 6 MCP -->
  <rect x="726" y="300" width="176" height="104" rx="12" fill="#eef3fd" stroke="#3d6df2" stroke-width="1.8"/>
  <text x="814" y="332" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="600">fux mcp</text>
  <text x="814" y="354" font-size="11" fill="#52514e" text-anchor="middle">the same index,</text>
  <text x="814" y="372" font-size="11" fill="#52514e" text-anchor="middle">spoken to coding agents</text>
  <text x="814" y="390" font-size="11" fill="#52514e" text-anchor="middle">search · passage · related</text>
  <line x1="690" y1="214" x2="732" y2="314" stroke="#3d6df2" stroke-width="1.8" marker-end="url(#b)"/>
  <text x="814" y="424" font-size="10" fill="#898781" text-anchor="middle">no answer tool —</text>
  <text x="814" y="439" font-size="10" fill="#898781" text-anchor="middle">the agent is the answerer</text>

  <!-- fetch-back arrow: the verbs quote the live document -->
  <path d="M 880 190 L 928 190 L 928 500 L 24 500 L 24 145 L 36 145" fill="none" stroke="#5f6b7a" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="476" y="492" font-size="11" fill="#52514e" text-anchor="middle">answers quote the live document, freshness-checked — never a stored copy</text>

  <text x="40" y="536" font-size="11" fill="#898781">The index finds; the sources speak. Everything committed is readable text; everything fast is rebuildable.</text>
</svg>
