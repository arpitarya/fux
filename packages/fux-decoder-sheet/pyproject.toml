# W-289: one of the fifteen plugin packages, built from this tree (SR-PLUGINS).
# Released on fux's own version, in lockstep (P11); a repository runs it only
# when `.fux/config/plugins.toml` declares it, pinned (P2-P4).
[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "fux-decoder-sheet"
version = "5.1.0"
description = "Fux decoder package: spreadsheets — Excel workbooks, CSV and TSV."
readme = "README.md"
requires-python = ">=3.12"
# L2: an OSI-approved licence by SPDX identifier, fux's own (records/0004_LAW-2-zero-cost.md).
license = "MIT"
authors = [{ name = "arpit arya", email = "arpitarya.me@gmail.com" }]
# The pins are the release's one version, held equal by scripts/check-version-parity.py.
dependencies = ["fux-core==5.1.0", "fux-extension-table==5.1.0"]

[project.urls]
Homepage = "https://github.com/arpitarya/fux"
Repository = "https://github.com/arpitarya/fux"

[tool.hatch.build.targets.wheel]
packages = ["src/fux_decoder_sheet"]
