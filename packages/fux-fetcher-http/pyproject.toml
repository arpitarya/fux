# W-289: one of the fifteen plugin packages, built from this tree (SR-PLUGINS).
# Released on fux's own version, in lockstep (P11); a repository runs it only
# when `.fux/config/plugins.toml` declares it, pinned (P2-P4).
[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "fux-fetcher-http"
version = "5.1.1"
description = "Fux fetcher package: a plain HTTP GET, standard library only."
readme = "README.md"
requires-python = ">=3.12"
# L2: an OSI-approved licence by SPDX identifier, fux's own (records/0004_LAW-2-zero-cost.md).
license = "MIT"
authors = [{ name = "arpit arya", email = "arpitarya.me@gmail.com" }]
# SR-PLUGINS P10 / SR-FETCHER decision 1: a fetcher package imports NOTHING
# from fux and depends on nothing; fux loads it only when a URL line names it.
dependencies = []

[project.urls]
Homepage = "https://github.com/arpitarya/fux"
Repository = "https://github.com/arpitarya/fux"

[tool.hatch.build.targets.wheel]
packages = ["src/fux_fetcher_http"]
