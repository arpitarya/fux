# W-282: one of the four distributions built from the shared tree at ../../src.
# WHICH files it carries is records/README.md §The layer map's, read by
# ../layer_hook.py — never listed here. Wheels only: the role packages are
# built from the repository, and fux-engine's sdist is the buildable source.
[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "fux-writer"
dynamic = ["version"]
description = "Fux's writer — ingest, setup, hooks and upkeep for a committed fux index; no ranking."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "arpit arya", email = "arpitarya.me@gmail.com" }]
# L2: OSI-approved licences only, and no optional extras (role packages are
# complete for their role — records/0004_LAW-2-zero-cost.md). The pin is the
# release's one version, held equal by scripts/check-version-parity.py.
dependencies = ["fux-core==4.0.0"]

[project.scripts]
fux-merge-index = "fux.maintain.mergedriver:main"

[project.urls]
Homepage = "https://github.com/arpitarya/fux"
Repository = "https://github.com/arpitarya/fux"

[tool.hatch.version]
path = "../../src/fux/__init__.py"

[tool.hatch.build.targets.wheel]
bypass-selection = true
dev-mode-dirs = ["../../src"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "../layer_hook.py"
layer = "writer"
