# The reviewed allow-list of SR-LAW-12's AST veto test (W-225 stage 7).
#
# Every literal `tests/l12_lib.py` still finds in src/fux/** and node/src/** is
# here, under the decision-6 category that makes it code rather than a value.
# A site is `path::scope::kind::literal` -- no line number, so an unrelated edit
# does not rewrite this file. `tests/test_l12_values_live_in_config.py` fails on
# a scanned site that is not listed, and on a listed site that no longer exists.
#
# `pending-w228` and `for-arpit` are NOT decision-6 categories: the first is
# stage 5f's remaining work, the second is open questions in
# work/compare/l12-classify.compare.md. Neither may grow without a ruling.
# `for-arpit` is empty since 2026-09-28: SR-LAW-12 decision 6b (R13) sorted its
# sixteen sites -- thirteen moved to constants.toml and templates/, three below.

