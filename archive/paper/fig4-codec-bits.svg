<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect width="720" height="360" fill="#fcfcfb"/>
  <text x="24" y="30" font-size="14" fill="#0b0b0b" font-weight="600">Figure 4 — Docid compression: bits per posting, by codec (Gov2, from literature)</text>
  <text x="24" y="47" font-size="11" fill="#52514e">Ottaviano &amp; Venturini (SIGIR '14); Moffat &amp; Stuiver (2000). Lower is smaller on the wire.</text>

  <!-- x scale 0..12 bits → 500px from 170 ; px = bits*41.67 -->
  <g stroke="#e1e0d9" stroke-width="1">
    <line x1="170" y1="70" x2="170" y2="272"/>
    <line x1="295" y1="70" x2="295" y2="272"/>
    <line x1="420" y1="70" x2="420" y2="272"/>
    <line x1="545" y1="70" x2="545" y2="272"/>
    <line x1="670" y1="70" x2="670" y2="272"/>
  </g>
  <g font-size="10" fill="#898781" text-anchor="middle">
    <text x="170" y="288">0</text>
    <text x="295" y="288">3 bits</text>
    <text x="420" y="288">6 bits</text>
    <text x="545" y="288">9 bits</text>
    <text x="670" y="288">12 bits</text>
  </g>

  <g font-size="11" fill="#0b0b0b" text-anchor="end">
    <text x="160" y="94">Varint-G8IU</text>
    <text x="160" y="138">OptPFD</text>
    <text x="160" y="182">Partitioned Elias-Fano</text>
    <text x="160" y="226">Binary Interpolative</text>
    <text x="160" y="266">clustered-list regime</text>
  </g>
  <g fill="#2a78d6">
    <rect x="170" y="78" width="483" height="22" rx="4"/>
    <rect x="170" y="122" width="217" height="22" rx="4"/>
    <rect x="170" y="166" width="193" height="22" rx="4"/>
    <rect x="170" y="210" width="188" height="22" rx="4"/>
    <rect x="170" y="252" width="38" height="18" rx="4" fill="#86b6ef"/>
  </g>
  <g font-size="10.5" fill="#52514e">
    <text x="645" y="94" text-anchor="end" fill="#fcfcfb">~11.6 bpi</text>
    <text x="393" y="138">~5.2 bpi</text>
    <text x="369" y="182">4.63 bpi</text>
    <text x="364" y="226">~4.5 bpi · chosen wire codec</text>
    <text x="214" y="266">&lt;1 bpi where docids cluster (survey; id-reordering aims here)</text>
  </g>

  <text x="24" y="316" font-size="10" fill="#898781">Fux v2 wire budget assumes ~6–9 bits per posting all-in (docid + 4-bit quantized impact) — conservative against BIC's</text>
  <text x="24" y="330" font-size="10" fill="#898781">measured docid rates, with headroom if ledger-order id assignment produces the clustering the survey documents.</text>
</svg>
